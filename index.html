<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Физика 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&family=PT+Serif:ital@1&display=swap" rel="stylesheet">
<style>
/* Layout: one column on graph paper; exam answers sit in answer-sheet cells, formulas in serif italic */
:root{
  --paper:#F3F7F6; --card:#FFFFFF; --ink:#11252A; --muted:#566B70; --line:#CFDCD9; --grid:#DCE8E5;
  --accent:#0B7A6A; --accent-ink:#FFFFFF; --accent-soft:#E0F1EE;
  --ok:#1D7A3E; --ok-soft:#E2F2E6; --warn:#97600C; --warn-soft:#F8EED9; --bad:#B4372F; --bad-soft:#FAE3E0; --lock:#97A6A9;
  --f-display:"Exo 2","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-formula:"PT Serif",Georgia,"Times New Roman",serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0C1517; --card:#132024; --ink:#E3EEEC; --muted:#93A9AC; --line:#25383C; --grid:#1B2B2F;
  --accent:#4FD1B9; --accent-ink:#0C1517; --accent-soft:#17332F;
  --ok:#5BCB83; --ok-soft:#163023; --warn:#E5AE52; --warn-soft:#33281A; --bad:#F27B70; --bad-soft:#3A1E1F; --lock:#566A6E;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C1517; --card:#132024; --ink:#E3EEEC; --muted:#93A9AC; --line:#25383C; --grid:#1B2B2F;
  --accent:#4FD1B9; --accent-ink:#0C1517; --accent-soft:#17332F;
  --ok:#5BCB83; --ok-soft:#163023; --warn:#E5AE52; --warn-soft:#33281A; --bad:#F27B70; --bad-soft:#3A1E1F; --lock:#566A6E;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:grid;gap:22px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.7rem,6vw,2.3rem);letter-spacing:-.01em;line-height:1.1}
h2{font-family:var(--f-display);font-weight:600;font-size:1.1rem}
p{margin:0}
b{font-weight:600}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kicker{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.f{font-family:var(--f-formula);font-style:italic;font-size:1.08em;white-space:nowrap}
.f i{font-style:italic}
.f sub{font-style:normal;font-family:var(--f-body);font-size:.68em}
.top{display:grid;gap:6px;padding:16px;border-radius:var(--r);border:1px solid var(--line);
  background-color:var(--card);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:12px 12px}
.target{font-size:.88rem;color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{display:grid;gap:6px;min-width:0}
.stat .lbl{font-size:.72rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.cells{display:flex;gap:3px;flex-wrap:wrap}
.cell{display:inline-grid;place-items:center;min-width:26px;height:34px;padding:0 4px;border:1.5px solid var(--line);background:var(--card);font-family:var(--f-mono);font-weight:700;font-size:1.05rem;border-radius:3px;font-variant-numeric:tabular-nums}
.cell.sep{border-color:transparent;background:transparent;min-width:10px;padding:0}
.cell.empty{color:var(--lock)}

.today{display:grid;gap:10px}
.btn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary .sub{color:inherit;opacity:.85}
.btn .t{font-weight:600;font-size:1.02rem}
.btn .sub{font-size:.85rem;color:var(--muted)}
.btn .arr{font-family:var(--f-mono);font-weight:700}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.small{padding:10px 14px;width:auto;display:inline-flex}
.note{font-size:.9rem;color:var(--muted)}

.map{display:grid;gap:12px}
.block{border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.block>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px}
.block>summary::-webkit-details-marker{display:none}
.block>summary .bt{font-weight:600}
.block>summary .bm{font-size:.82rem;color:var(--muted);text-align:right}
.topics{display:grid;border-top:1px solid var(--line)}
.topic{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%;cursor:pointer}
.topic:last-child{border-bottom:0}
.topic:hover:not([disabled]){background:var(--accent-soft)}
.topic[disabled]{cursor:default;color:var(--lock)}
.topic .n{font-family:var(--f-mono);font-weight:700;font-size:.85rem;min-width:3ch;text-align:center;border:1.5px solid var(--line);border-radius:3px;padding:2px 4px}
.topic[disabled] .n{border-style:dashed}
.topic .tt{min-width:0;display:grid;gap:2px}
.topic .ts{font-size:.78rem;color:var(--muted)}
.topic[disabled] .ts{color:var(--lock)}
.topic .bar{height:3px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden}
.topic .bar i{display:block;height:100%;background:var(--accent)}
.chip{font-size:.72rem;font-weight:600;letter-spacing:.03em;padding:3px 8px;border-radius:999px;white-space:nowrap}
.chip.new{border:1px solid var(--line);color:var(--muted)}
.chip.learning{background:var(--warn-soft);color:var(--warn)}
.chip.mastered{background:var(--accent-soft);color:var(--accent)}
.chip.fixed{background:var(--ok-soft);color:var(--ok)}
.chip.lock{color:var(--lock);border:1px dashed var(--line)}
.boss{display:grid;gap:8px;padding:14px 16px;border-top:1px solid var(--line);background:var(--paper)}

details.how{border-top:1px solid var(--line);padding-top:14px}
details.how summary{cursor:pointer;font-weight:600}
details.how ul{margin:10px 0 0;padding-left:20px;display:grid;gap:6px;color:var(--muted)}
.sync{font-size:.8rem;color:var(--muted)}
.backup{display:grid;gap:10px;margin-top:10px}
.backup textarea{width:100%;min-width:0;border:1.5px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);padding:8px 10px;font-family:var(--f-mono);font-size:.8rem;resize:vertical}
.lesson .graph{margin-block:2px}

.back{border:0;background:transparent;color:var(--accent);cursor:pointer;padding:0;font-weight:600;justify-self:start}
.lesson{display:grid;gap:14px;max-width:65ch}
.lesson h3{font-family:var(--f-display);font-weight:600;font-size:1.02rem;margin-top:6px}
.lesson ul{margin:0;padding-left:20px;display:grid;gap:6px}
.life{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 14px}
.life .kicker{display:block;margin-bottom:4px;color:var(--accent)}
.termshead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:6px}
.termshead h3{margin:0}
.terms{display:grid;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.term{border-bottom:1px solid var(--line)}
.term:last-child{border-bottom:0}
.term>summary{list-style:none;cursor:pointer;display:grid;gap:2px;padding:10px 14px}
.term>summary::-webkit-details-marker{display:none}
.term>summary:hover{background:var(--accent-soft)}
.term .tn{font-weight:600}
.term .td{color:var(--muted)}
.term .tl{font-size:.8rem;font-weight:600;color:var(--accent);margin-top:4px}
.term .tl::after{content:" ↓"}
.term[open] .tl::after{content:" ↑"}
.term .tx{margin:0 14px 12px;padding:6px 0 6px 12px;border-left:3px solid var(--accent)}

.graph{width:100%;max-width:420px;height:auto;display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.graph .gl{stroke:var(--grid);stroke-width:1}
.graph .ax{stroke:var(--ink);stroke-width:1.5}
.graph .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.graph .tk{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.graph .al{fill:var(--ink);font-family:var(--f-formula);font-style:italic;font-size:13px}
.graph .pt{fill:var(--accent)}
.graph .lb{fill:var(--ink);font-family:var(--f-mono);font-weight:700;font-size:12px}
.tablewrap{overflow-x:auto}
.qtable{border-collapse:collapse;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.qtable th,.qtable td{border:1px solid var(--line);padding:6px 12px;text-align:center;background:var(--card)}
.qtable th{font-family:var(--f-formula);font-style:italic;font-weight:400}

.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qcard{display:grid;gap:14px}
.qtext{font-size:1.1rem;font-weight:600;line-height:1.45}
.qdef{font-size:1.05rem;border-left:3px solid var(--accent);padding:4px 0 4px 12px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .num{font-family:var(--f-mono);font-weight:700;display:inline-grid;place-items:center;width:26px;height:26px;border:1.5px solid var(--line);border-radius:3px;font-size:.9rem}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .num{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .num{border-color:var(--ok);background:var(--ok);color:var(--card)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .num{border-color:var(--bad);background:var(--bad);color:var(--card)}
.opt[disabled]{cursor:default}
.legend{display:grid;gap:4px;font-size:.92rem;border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:10px 14px}
.legend .ln{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline}
.legend .d{font-family:var(--f-mono);font-weight:700}
.rows{display:grid;gap:10px}
.rowq{display:grid;gap:8px;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 14px}
.rowq .rl{font-weight:600}
.rc{display:flex;gap:8px;flex-wrap:wrap}
.rb{min-width:44px;height:40px;border:1.5px solid var(--line);background:var(--paper);border-radius:6px;font-family:var(--f-mono);font-weight:700;cursor:pointer}
.rb.sel{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.rb.right{border-color:var(--ok);background:var(--ok);color:var(--card)}
.rb.wrong{border-color:var(--bad);background:var(--bad);color:var(--card)}
.rb[disabled]{cursor:default}
.numrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numrow input{width:10ch;min-width:0;height:44px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);padding:0 10px;font-family:var(--f-mono);font-weight:700;font-size:1.1rem}
.numrow input.right{border-color:var(--ok);background:var(--ok-soft)}
.numrow input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.numrow .pm{height:44px;min-width:44px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);font-family:var(--f-mono);font-weight:700;cursor:pointer}
.numrow .unit{font-weight:600}
.answerline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.fb{border-radius:var(--r);padding:12px 14px;display:grid;gap:6px}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fb .h{font-weight:700}
.fb.ok .h{color:var(--ok)}
.fb.bad .h{color:var(--bad)}
.result{display:grid;gap:14px}
.big{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:1}
.row{display:flex;gap:10px;flex-wrap:wrap}
.kbd{font-family:var(--f-mono);font-size:.75rem}
@media (max-width:420px){.cell{min-width:22px;height:30px;font-size:.95rem}.stat .lbl{font-size:.66rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
function fmtNum(v){ return String(Math.round(v*1000)/1000).replace(".", ","); }
function graph(o){
  const W=340, H=210, L=44, R=40, T=24, B=30;
  const [x0,x1] = o.x, [y0,y1] = o.y;
  const sx = v => L + (v-x0)/(x1-x0)*(W-L-R), sy = v => T + (y1-v)/(y1-y0)*(H-T-B);
  let s = "";
  for (let v=x0; v<=x1+1e-9; v+=o.dx) s += `<line class="gl" x1="${sx(v)}" y1="${sy(y0)}" x2="${sx(v)}" y2="${sy(y1)}"/>`;
  for (let v=y0; v<=y1+1e-9; v+=o.dy) s += `<line class="gl" x1="${sx(x0)}" y1="${sy(v)}" x2="${sx(x1)}" y2="${sy(v)}"/>`;
  s += `<line class="ax" x1="${sx(x0)}" y1="${sy(0)}" x2="${sx(x1)+16}" y2="${sy(0)}"/>`;
  s += `<line class="ax" x1="${sx(x0)}" y1="${sy(y0)}" x2="${sx(x0)}" y2="${sy(y1)-12}"/>`;
  const ty = y0 < 0 ? sy(y0)+15 : sy(0)+15;
  for (let v=x0+o.dx; v<=x1+1e-9; v+=o.dx) s += `<text class="tk" x="${sx(v)}" y="${ty}" text-anchor="middle">${fmtNum(v)}</text>`;
  for (let v=y0; v<=y1+1e-9; v+=o.dy) if (Math.abs(v)>1e-9) s += `<text class="tk" x="${sx(x0)-7}" y="${sy(v)+4}" text-anchor="end">${fmtNum(v)}</text>`;
  s += `<text class="tk" x="${sx(x0)-7}" y="${y0 < 0 ? sy(0)+4 : sy(0)+15}" text-anchor="end">0</text>`;
  s += `<polyline class="ln" points="${o.pts.map(p => sx(p[0])+","+sy(p[1])).join(" ")}"/>`;
  (o.marks||[]).forEach(m => { s += `<circle class="pt" cx="${sx(m[0])}" cy="${sy(m[1])}" r="3.5"/><text class="lb" x="${sx(m[0])+(m[3]||6)}" y="${sy(m[1])+(m[4]||-6)}">${m[2]}</text>`; });
  s += `<text class="al" x="${sx(x1)+16}" y="${sy(0)-7}" text-anchor="end">${o.xl}</text>`;
  s += `<text class="al" x="${sx(x0)+7}" y="${sy(y1)-6}">${o.yl}</text>`;
  return `<svg class="graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.aria||"График"}">${s}</svg>`;
}
function table(rows){ return `<div class="tablewrap"><table class="qtable">${rows.map(r => `<tr><th>${r[0]}</th>${r.slice(1).map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`; }
const F = s => `<span class="f">${s}</span>`;
const CHANGE = ["увеличивается","уменьшается","не изменяется"];
const NEW_TOPICS_7_10 = [
{ id:"t7", num:7, title:"МКТ, уравнение состояния, изопроцессы", fmt:"ответ числом · 1 балл",
  lesson:[
   {p:"Задание 7 проверяет МКТ и газовые законы: связь температуры со средней кинетической энергией молекул, уравнение Менделеева — Клапейрона, изопроцессы. Три задачи из восьми даны графиками. Ответ — число."},
   {h:"Ловушки ЕГЭ"},
   {ul:[
    "<b>Только кельвины.</b> "+F("<i>T</i> = <i>t</i> + 273")+". Градусы Цельсия в формулы газа не подставляют.",
    "<b>Перевод в СИ.</b> кПа → Па (×1000), л → м³ (÷1000), г → кг. Если ответ — «во сколько раз», единицы переводить не нужно, а температура всё равно в К.",
    "<b>Что постоянно.</b> Сначала реши, какие величины не меняются: масса газа и один из параметров (<i>T</i>, <i>p</i> или <i>V</i>). Газ выпустили или добавили — готовый изопроцесс не подходит.",
    "<b>Единицы ответа.</b> Просят кПа, а получилось в Па — раздели на 1000."
   ]},
   {h:"Как читать график"},
   {ul:[
    "<b>p(T), прямая через начало координат</b> — изохора: давление меняется во столько же раз, во сколько <i>T</i>.",
    "<b>p(T), горизонталь</b> — изобара: объём меняется во столько же раз, во сколько <i>T</i>.",
    "<b>V(T), прямая через начало координат</b> — изобара."
   ]},
   {svg: graph({pts:[[0,0],[400,200]],x:[0,500],y:[0,250],dx:100,dy:50,xl:"T, К",yl:"p, кПа"})},
   {life:"Мяч, вынесенный на мороз, становится мягче: газ внутри остыл, давление упало, а воздуха в мяче стало не меньше."}
  ],
  cards:[
   {type:"formula",name:"Основное уравнение МКТ",f:"<i>p</i> = (2/3)<i>n</i><i>Ē</i>",life:"Чем больше молекул воздуха в каждом кубометре шины и чем быстрее они летают, тем сильнее воздух давит на покрышку."},
   {type:"formula",name:"Энергия молекул и температура",f:"<i>Ē</i> = (3/2)<i>kT</i>",life:"В жаркий день молекулы воздуха в среднем движутся быстрее, чем зимой: средняя кинетическая энергия растёт вместе с температурой."},
   {type:"formula",name:"Уравнение Менделеева — Клапейрона",f:"<i>pV</i> = <i>νRT</i>,  <i>ν</i> = <i>m</i>/<i>M</i>",life:"Накачал мяч: воздуха (ν) стало больше, объём почти тот же, значит давление выросло."},
   {type:"formula",name:"Перевод температуры в кельвины",f:"<i>T</i> = <i>t</i> + 273",life:"В комнате +27 °C — это 300 К. В формулу газа идёт именно 300, а не 27."},
   {type:"term",term:"Изохорный процесс",def:"Процесс при постоянных объёме и массе газа, для него p/T = const.",life:"Баллончик с аэрозолем нельзя греть: объём баллончика не меняется, поэтому давление внутри растёт и он может взорваться."},
   {type:"term",term:"Изобарный процесс",def:"Процесс при постоянных давлении и массе газа, для него V/T = const.",life:"Воздушный шарик, вынесенный из тёплой комнаты на мороз, сжимается: давление внутри почти равно атмосферному, а объём падает вместе с температурой."},
   {type:"term",term:"Изотермический процесс",def:"Процесс при постоянных температуре и массе газа, для него pV = const.",life:"Закрыл пальцем носик шприца и медленно давишь на поршень: температура та же, объём меньше, давление больше."}
  ],
  qs:[
   {type:"num",q:"Найдите среднюю кинетическую энергию поступательного движения молекул гелия при температуре 27 °C. Ответ дайте в 10⁻²¹ Дж.",unit:"·10⁻²¹ Дж",ans:6.21,calc:"1.5*1.38*300/100",why:"T = 27 + 273 = 300 К. Ē = 3kT/2 = 1,5 · 1,38·10⁻²³ · 300 = 6,21·10⁻²¹ Дж."},
   {type:"num",q:"Постоянную массу идеального газа охладили из состояния при температуре 600 К до состояния при температуре 200 К (график). Во сколько раз уменьшился объём газа?",svg:graph({pts:[[200,200],[600,200]],x:[0,700],y:[0,300],dx:100,dy:100,xl:"T, К",yl:"p, кПа"}),unit:"раз",ans:3,calc:"600/200",why:"Горизонталь на графике p(T): давление постоянно, процесс изобарный, V/T = const. V₁/V₂ = T₁/T₂ = 600/200 = 3."},
   {type:"num",q:"Средняя кинетическая энергия поступательного движения молекул идеального газа увеличилась в 1,5 раза. Начальная температура газа 27 °C. Чему равна конечная температура газа? Ответ дайте в °C.",unit:"°C",ans:177,calc:"300*1.5-273",why:"Ē ~ T, поэтому T₂ = 1,5 · T₁ = 1,5 · 300 = 450 К. В градусах Цельсия t₂ = 450 − 273 = 177 °C."},
   {type:"num",q:"Концентрация молекул идеального газа 3·10²⁵ м⁻³, средняя кинетическая энергия их поступательного движения 6·10⁻²¹ Дж. Найдите давление газа. Ответ дайте в кПа.",unit:"кПа",ans:120,calc:"2*3e25*6e-21/3/1000",why:"p = 2nĒ/3 = 2 · 3·10²⁵ · 6·10⁻²¹ / 3 = 1,2·10⁵ Па = 120 кПа."},
   {type:"num",q:"Идеальный газ в количестве 2 моль участвует в изобарном процессе. На рисунке показана зависимость объёма газа от абсолютной температуры. Найдите давление газа. Ответ дайте в кПа.",svg:graph({pts:[[100,2],[400,8]],x:[0,500],y:[0,10],dx:100,dy:2,xl:"T, К",yl:"V, л"}),unit:"кПа",ans:831,calc:"2*8.31*400/0.008/1000",why:"Возьмём точку графика: T = 400 К, V = 8 л = 0,008 м³. p = νRT/V = 2 · 8,31 · 400 / 0,008 = 831000 Па = 831 кПа."},
   {type:"num",q:"Газ в закрытом баллоне нагрели от 27 °C до 87 °C. Начальное давление газа 150 кПа, масса газа не менялась. Каким стало давление газа? Ответ дайте в кПа.",unit:"кПа",ans:180,calc:"150*(87+273)/(27+273)",why:"Объём постоянен: p₁/T₁ = p₂/T₂. T₁ = 300 К, T₂ = 360 К. p₂ = 150 · 360/300 = 180 кПа."},
   {type:"num",q:"В сосуде объёмом 8,31 л находится идеальный газ. На рисунке показана зависимость давления газа от температуры при постоянном объёме. Найдите количество вещества газа. Ответ дайте в молях.",svg:graph({pts:[[100,50],[500,250]],x:[0,600],y:[0,300],dx:100,dy:50,xl:"T, К",yl:"p, кПа"}),unit:"моль",ans:0.5,calc:"200000*0.00831/(8.31*400)",why:"Возьмём точку графика: T = 400 К, p = 200 кПа. V = 8,31 л = 0,00831 м³. ν = pV/(RT) = 200000 · 0,00831 / (8,31 · 400) = 0,5 моль."},
   {type:"num",q:"Баллон вместимостью 10 л содержит 16 г кислорода O₂ (молярная масса 32 г/моль) при температуре 27 °C. Каково давление газа? Ответ дайте в кПа.",unit:"кПа",ans:124.65,calc:"(16/32)*8.31*300/0.01/1000",why:"ν = m/M = 16/32 = 0,5 моль; T = 300 К; V = 10 л = 0,01 м³. p = νRT/V = 0,5 · 8,31 · 300 / 0,01 = 124650 Па = 124,65 кПа."}
  ]},

{ id:"t8", num:8, title:"Теплота, работа газа, первый закон", fmt:"ответ числом · 1 балл",
  lesson:[
   {p:"Задание 8 проверяет умение считать количество теплоты, работу газа и применять первый закон термодинамики и формулу КПД. Две задачи из восьми даны графиком p(V). Ответ — число."},
   {h:"Ловушки ЕГЭ"},
   {ul:[
    "<b>Плавление и кипение.</b> Температура не меняется, поэтому «<i>c</i>Δ<i>t</i>» не нужно: берём только <i>λm</i> или <i>Lm</i>. Если лёд холоднее 0 °C, сначала нагрей его до 0 °C, потом плавь — теплоты складываются.",
    "<b>Единицы.</b> Масса в кг (г → кг), Дж ↔ кДж. На графике p(V): <b>кПа · л = Дж</b>, в СИ переводить не нужно.",
    "<b>Знаки.</b> Газ расширяется — его работа положительна, сжимается — отрицательна. Газ отдал теплоту — <i>Q</i> отрицательно. Первый закон: "+F("Δ<i>U</i> = <i>Q</i> + <i>A</i><sub>внеш</sub>")+".",
    "<b>КПД</b> — доля полезной работы от <i>полученной</i> теплоты. Смотри, что просят: проценты или долю."
   ]},
   {h:"Как читать график p(V)"},
   {ul:[
    "<b>Работа газа</b> — площадь под графиком до оси V. Горизонталь на высоте 200 кПа от 1 до 4 л даёт 200 · 3 = 600 Дж.",
    "Вправо (<i>V</i> растёт) — работа газа положительна, влево — отрицательна.",
    "Замкнутый цикл по часовой стрелке: работа за цикл — площадь внутри фигуры."
   ]},
   {svg: graph({pts:[[1,200],[4,200]],x:[0,5],y:[0,300],dx:1,dy:100,xl:"V, л",yl:"p, кПа"})},
   {life:"Когда качаешь шину насосом, насос нагревается: ты совершаешь работу над воздухом, и она идёт на рост его внутренней энергии."}
  ],
  cards:[
   {type:"formula",name:"Нагревание и охлаждение",f:"<i>Q</i> = <i>cm</i>(<i>t</i><sub>2</sub> − <i>t</i><sub>1</sub>)",life:"Чтобы нагреть литр воды в чайнике на 80 °C, нужно около 340 кДж, поэтому чайник греется несколько минут."},
   {type:"formula",name:"Плавление",f:"<i>Q</i> = <i>λm</i>",life:"Пока лёд в стакане не растаял, вся теплота из комнаты уходит на плавление, и напиток остаётся холодным, около 0 °C."},
   {type:"formula",name:"Парообразование",f:"<i>Q</i> = <i>Lm</i>",life:"Вода в чайнике уже кипит, а ты ещё держишь его на плите: теплота идёт на превращение воды в пар, температура остаётся 100 °C."},
   {type:"formula",name:"Работа газа при постоянном давлении",f:"<i>A</i> = <i>p</i>(<i>V</i><sub>2</sub> − <i>V</i><sub>1</sub>)",life:"Нагретый воздух в шприце без иглы выталкивает поршень: газ расширяется и совершает работу."},
   {type:"formula",name:"Первый закон термодинамики",f:"<i>Q</i> = Δ<i>U</i> + <i>A</i><sub>газа</sub>",life:"Из баллончика дезодоранта газ вырывается, расширяется и совершает работу, из-за чего баллончик холодный."},
   {type:"formula",name:"КПД теплового двигателя",f:"<i>η</i> = (<i>Q</i><sub>1</sub> − <i>Q</i><sub>2</sub>)/<i>Q</i><sub>1</sub>",life:"Двигатель машины сжигает бензин, но полезной работой становится лишь часть теплоты, остальное уходит в выхлоп и радиатор."},
   {type:"term",term:"Работа газа по графику",def:"Площадь под графиком p(V) между начальным и конечным объёмом, а за цикл — площадь внутри замкнутой фигуры.",life:"Как путь по графику скорости считают площадью, так и работу газа на графике p(V): чем выше и шире, тем работы больше."}
  ],
  qs:[
   {type:"num",q:"Какое количество теплоты необходимо, чтобы нагреть 2 кг воды от 20 °C до 70 °C? Удельная теплоёмкость воды 4200 Дж/(кг·К). Ответ дайте в кДж.",unit:"кДж",ans:420,calc:"4200*2*(70-20)/1000",why:"Q = cmΔt = 4200 · 2 · 50 = 420000 Дж = 420 кДж."},
   {type:"num",q:"Идеальный газ расширяется, его состояние меняется по графику, показанному на рисунке. Найдите работу газа в этом процессе. Ответ дайте в Дж.",svg:graph({pts:[[2,100],[6,300]],x:[0,8],y:[0,400],dx:1,dy:100,xl:"V, л",yl:"p, кПа"}),unit:"Дж",ans:800,calc:"(100+300)/2*(6-2)",why:"Работа — площадь трапеции под графиком: (100 + 300)/2 · (6 − 2) = 800 кПа·л = 800 Дж."},
   {type:"num",q:"Лёд массой 200 г при температуре −10 °C нагрели до 0 °C и полностью расплавили. Какое количество теплоты потребовалось? Удельная теплоёмкость льда 2100 Дж/(кг·К), удельная теплота плавления льда 3,3·10⁵ Дж/кг. Ответ дайте в кДж.",unit:"кДж",ans:70.2,calc:"(2100*0.2*10+3.3e5*0.2)/1000",why:"Q = cmΔt + λm = 2100 · 0,2 · 10 + 3,3·10⁵ · 0,2 = 4200 + 66000 = 70200 Дж = 70,2 кДж."},
   {type:"num",q:"Газ при постоянном давлении 200 кПа расширился от 3 л до 8 л. Какую работу совершил газ? Ответ дайте в Дж.",unit:"Дж",ans:1000,calc:"200000*(8-3)/1000",why:"A = pΔV = 200·10³ Па · 5·10⁻³ м³ = 1000 Дж."},
   {type:"num",q:"Над идеальным газом внешние силы совершили работу 300 Дж, при этом газ отдал окружающей среде 100 Дж теплоты. На сколько джоулей изменилась внутренняя энергия газа?",unit:"Дж",ans:200,calc:"-100+300",why:"ΔU = Q + A_внеш. Газ отдал теплоту, значит Q = −100 Дж. ΔU = −100 + 300 = 200 Дж (энергия выросла)."},
   {type:"num",q:"На рисунке показан цикл, который совершает идеальный газ (обход по часовой стрелке). Найдите работу газа за цикл. Ответ дайте в Дж.",svg:graph({pts:[[1,100],[1,300],[4,300],[4,100],[1,100]],x:[0,5],y:[0,400],dx:1,dy:100,xl:"V, л",yl:"p, кПа"}),unit:"Дж",ans:600,calc:"(4-1)*(300-100)",why:"Работа за цикл — площадь прямоугольника: (4 − 1) л · (300 − 100) кПа = 600 Дж. Обход по часовой стрелке, поэтому работа положительна."},
   {type:"num",q:"Тепловой двигатель за цикл получает от нагревателя 800 Дж теплоты и отдаёт холодильнику 600 Дж. Каков КПД двигателя? Ответ дайте в процентах.",unit:"%",ans:25,calc:"(800-600)/800*100",why:"Полезная работа A = Q₁ − Q₂ = 200 Дж. η = A/Q₁ = 200/800 = 0,25 = 25 %."},
   {type:"num",q:"Какую массу воды, нагретой до температуры кипения (100 °C), можно полностью превратить в пар, передав ей 1150 кДж теплоты? Удельная теплота парообразования воды 2,3·10⁶ Дж/кг. Ответ дайте в кг.",unit:"кг",ans:0.5,calc:"1150e3/2.3e6",why:"Температура уже 100 °C и не меняется, значит Q = Lm. m = Q/L = 1,15·10⁶ / 2,3·10⁶ = 0,5 кг."}
  ]},

{ id:"t9", num:9, title:"Анализ тепловых процессов: верные утверждения", fmt:"выбор утверждений · 2 балла",
  lesson:[
   {p:"Задание 9 — анализ тепловых процессов по графику или описанию. Из пяти утверждений нужно выбрать верные, обычно два или три. Полный ответ — 2 балла, одна ошибка — 1 балл."},
   {h:"Ловушки ЕГЭ"},
   {ul:[
    "<b>Горизонталь на графике t(τ)</b> — не «ничего не происходит». Температура постоянна, но вещество получает теплоту, и внутренняя энергия растёт (плавление, кипение).",
    "<b>Температура и энергия.</b> Внутренняя энергия идеального газа зависит только от <i>T</i>: при <i>T</i> = const она не меняется.",
    "<b>Прямая — ещё не изопроцесс.</b> Прямая на p(T) или V(T) — изохора или изобара, только если её продолжение идёт через начало координат.",
    "<b>Насыщенный пар.</b> При постоянной температуре его давление и концентрация не меняются: при сжатии пар просто конденсируется.",
    "Проверяй каждое утверждение отдельно и по участкам графика. Сомневаешься — посчитай."
   ]},
   {h:"Как читать график t(τ)"},
   {ul:[
    "Наклонный участок — нагревание, горизонтальный — плавление или кипение.",
    "При постоянной мощности нагревателя чем положе наклон, тем больше удельная теплоёмкость вещества."
   ]},
   {svg: graph({pts:[[0,20],[8,100],[30,100]],x:[0,32],y:[0,120],dx:4,dy:20,xl:"τ, мин",yl:"t, °C"})},
   {life:"Чайник закипел: термометр застыл на 100 °C, но плита продолжает отдавать теплоту, и вода превращается в пар."}
  ],
  cards:[
   {type:"term",term:"Насыщенный пар",def:"Пар, находящийся в равновесии со своей жидкостью, его давление зависит только от температуры.",life:"Над водой в закрытой банке пар насыщенный: сколько молекул вылетает из воды, столько же в неё возвращается."},
   {type:"formula",name:"Относительная влажность",f:"<i>φ</i> = <i>p</i>/<i>p</i><sub>нас</sub> · 100 %",life:"В ванной после душа влажность почти 100 %, поэтому зеркало запотевает: пар конденсируется на холодном стекле."},
   {type:"term",term:"Температура при фазовом переходе",def:"Пока вещество плавится или кипит при неизменном давлении, его температура не меняется, а вся теплота идёт на изменение состояния.",life:"Чайник давно кипит, а термометр показывает всё те же 100 °C."},
   {type:"formula",name:"Внутренняя энергия одноатомного газа",f:"<i>U</i> = (3/2)<i>νRT</i>",life:"Нагрел воздух в шарике, и его внутренняя энергия выросла; а в большом шаре при той же температуре энергии больше, чем в маленьком."},
   {type:"formula",name:"Первый закон термодинамики",f:"<i>Q</i> = Δ<i>U</i> + <i>A</i><sub>газа</sub>",life:"Быстро накачал шину: насос нагрелся, потому что работа превратилась в рост внутренней энергии воздуха."},
   {type:"term",term:"Признаки изопроцессов на графиках",def:"Прямая через начало координат на p(T) — изохора, на V(T) — изобара, а гипербола на p(V) — изотерма.",life:"Шприц с закрытым носиком: если поршень вдавливать медленно, точка на графике p(V) идёт по ветви гиперболы, то есть изотерме."},
   {type:"formula",name:"Количество теплоты при нагревании",f:"<i>Q</i> = <i>cm</i>Δ<i>t</i>",life:"При одной и той же мощности плиты вода нагревается вдвое медленнее льда: её удельная теплоёмкость вдвое больше."}
  ],
  qs:[
   {type:"multi",q:"На рисунке показан график зависимости температуры вещества от времени при его равномерном нагревании. В момент времени 0 вещество — лёд. Мощность нагревателя постоянна, потерями теплоты можно пренебречь. Выберите все верные утверждения.",svg:graph({pts:[[0,-20],[2,0],[18,0],[26,40]],x:[0,28],y:[-20,40],dx:2,dy:20,xl:"τ, мин",yl:"t, °C"}),opts:["В течение первых двух минут вещество находится в твёрдом состоянии.","На участке 2–18 мин внутренняя энергия вещества остаётся постоянной.","В момент времени 10 мин в сосуде одновременно находятся лёд и вода.","Удельная теплоёмкость воды меньше удельной теплоёмкости льда.","Температура плавления вещества равна 0 °C."],ans:[0,2,4],why:"0–2 мин: лёд нагревается. 2–18 мин: идёт плавление, температура 0 °C постоянна, но внутренняя энергия растёт, поэтому утверждение про постоянную внутреннюю энергию неверно. Лёд нагрелся на 20 °C за 2 мин (10 °C/мин), вода на 40 °C за 8 мин (5 °C/мин) при той же мощности: теплоёмкость воды больше, значит утверждение про теплоёмкость неверно."},
   {type:"multi",q:"В цилиндре под поршнем находятся только вода и её насыщенный пар (воздуха нет). Температуру поддерживают постоянной и медленно вдвигают поршень, уменьшая объём. Часть пара при этом конденсируется, но вода и пар остаются. Выберите все верные утверждения.",opts:["Давление в цилиндре не меняется.","Масса воды в цилиндре уменьшается.","Концентрация молекул пара остаётся постоянной.","Относительная влажность пара уменьшается.","Масса пара в цилиндре увеличивается."],ans:[0,2],why:"Пока есть жидкость, пар насыщенный: его давление зависит только от T и не меняется, а p = nkT, значит и концентрация n постоянна. Пар конденсируется: масса воды растёт, масса пара падает, влажность остаётся 100 %."},
   {type:"multi",q:"На рисунке показан график циклического процесса 1–2–3–1 с постоянной массой идеального газа в координатах V–T. Выберите все верные утверждения.",svg:graph({pts:[[200,2],[400,4],[400,2],[200,2]],x:[0,500],y:[0,5],dx:100,dy:1,xl:"T, К",yl:"V, л",marks:[[200,2,"1",-14,14],[400,4,"2",6,-6],[400,2,"3",6,14]]}),opts:["В процессе 1–2 давление газа постоянно.","В процессе 2–3 давление газа уменьшается.","В процессе 2–3 внутренняя энергия газа не изменяется.","В процессе 3–1 газ совершает положительную работу.","В состоянии 3 давление газа в 2 раза больше, чем в состоянии 1."],ans:[0,2,4],why:"1–2: V/T = 2/200 = 4/400, прямая идёт через начало координат, значит p = const. 2–3: T = const, V уменьшается, давление растёт; U не меняется. 3–1: V = const, работа равна нулю. p ~ T/V: p₃/p₁ = (400/2)/(200/2) = 2."},
   {type:"multi",q:"Идеальный газ в цилиндре с теплоизолирующими стенками быстро сжимают поршнем, теплообмена с окружающей средой нет. Выберите все верные утверждения.",opts:["Газ не получает и не отдаёт теплоту.","Внутренняя энергия газа увеличивается.","Температура газа остаётся постоянной.","Работа газа положительна.","Средняя кинетическая энергия молекул газа уменьшается."],ans:[0,1],why:"Теплообмена нет: Q = 0. Газ сжимают, работа газа отрицательна, а внешние силы совершают положительную работу: ΔU = Q + A_внеш больше нуля. Значит, T и средняя кинетическая энергия молекул растут."},
   {type:"multi",q:"На рисунке показан график циклического процесса 1–2–3–1 с постоянной массой идеального газа в координатах p–V. Выберите все верные утверждения.",svg:graph({pts:[[1,300],[3,300],[3,100],[1,300]],x:[0,4],y:[0,400],dx:1,dy:100,xl:"V, л",yl:"p, кПа",marks:[[1,300,"1",-14,-6],[3,300,"2",6,-6],[3,100,"3",6,14]]}),opts:["В процессе 1–2 газ совершает работу 600 Дж.","В процессе 2–3 газ получает теплоту.","Температуры газа в состояниях 1 и 3 одинаковы.","В процессе 3–1 газ совершает отрицательную работу.","Процесс 3–1 является изотермическим."],ans:[0,2,3],why:"1–2: A = pΔV = 300 кПа · 2 л = 600 Дж. 2–3: объём постоянен, давление падает, T падает, газ отдаёт теплоту. p₁V₁ = 300 = p₃V₃, значит T₁ = T₃. 3–1: объём уменьшается, работа газа отрицательна. Изотерма на p–V — гипербола, а не прямая, поэтому 3–1 не изотерма."},
   {type:"multi",q:"Школьник изучает испарение и кипение жидкостей. Выберите все верные утверждения.",opts:["Жидкость испаряется при любой температуре.","Кипение жидкости происходит при любой температуре.","При кипении температура жидкости не меняется, если давление постоянно.","С ростом внешнего давления температура кипения жидкости уменьшается.","Скорость испарения не зависит от площади поверхности жидкости."],ans:[0,2],why:"Испарение идёт при любой температуре, а кипение — только при температуре кипения, которая при постоянном давлении не меняется. С ростом давления температура кипения растёт. Чем больше площадь поверхности, тем быстрее испарение."}
  ]},

{ id:"t10", num:10, title:"Как изменятся параметры газа", fmt:"две цифры · 2 балла",
  lesson:[
   {p:"Задание 10 — качественный анализ: как меняются две величины в процессе с газом. Ответ — две цифры: 1 — увеличивается, 2 — уменьшается, 3 — не изменяется. Цифры могут повторяться. Иногда нужно установить соответствие между величинами и формулами."},
   {h:"Ловушки ЕГЭ"},
   {ul:[
    "<b>Сначала найди постоянное.</b> «Закрытый сосуд» — <i>V</i> и масса постоянны; «лёгкий поршень» — <i>p</i> постоянно; «медленно» — обычно <i>T</i> постоянна.",
    "<b>Плотность и концентрация.</b> В закрытом сосуде они не меняются, даже если газ нагрели. Они меняются, когда меняется <i>V</i> или количество газа.",
    "<b>Средняя кинетическая энергия молекул</b> зависит только от <i>T</i>. <b>Внутренняя энергия</b> идеального газа зависит от <i>T</i> и от количества газа.",
    "<b>Газ выпустили или добавили.</b> Если <i>T</i> и <i>V</i> постоянны, давление меняется вслед за концентрацией: "+F("<i>p</i> = <i>nkT</i>")+"."
   ]},
   {h:"Алгоритм"},
   {ul:[
    "Выпиши формулу, связывающую величины, и отметь, что в ней постоянно.",
    "Реши для каждой величины отдельно: увеличилась, уменьшилась или осталась прежней."
   ]},
   {life:"Выпустил часть газа из бутылки с газировкой — давление в ней упало, потому что в том же объёме стало меньше молекул."}
  ],
  cards:[
   {type:"formula",name:"Закон Бойля — Мариотта",f:"<i>pV</i> = const  (<i>T</i> = const)",life:"Закрыл носик шприца и давишь на поршень: объём меньше, давление больше."},
   {type:"formula",name:"Закон Гей-Люссака",f:"<i>V</i>/<i>T</i> = const  (<i>p</i> = const)",life:"Шарик, внесённый с мороза в тёплую комнату, постепенно раздувается."},
   {type:"formula",name:"Закон Шарля",f:"<i>p</i>/<i>T</i> = const  (<i>V</i> = const)",life:"Закрытая бутылка, забытая на солнце, становится твёрже: объём тот же, давление растёт."},
   {type:"formula",name:"Давление и концентрация",f:"<i>p</i> = <i>nkT</i>",life:"Накачал шину: в том же объёме молекул стало больше, концентрация выросла, и давление выросло."},
   {type:"term",term:"Концентрация и плотность",def:"Концентрация n = N/V и плотность ρ = m/V зависят от объёма, а в закрытом сосуде от температуры не зависят.",life:"В закрытой банке с воздухом молекул сколько было, столько и осталось, хоть на холоде, хоть на батарее."},
   {type:"term",term:"Средняя кинетическая энергия молекул",def:"Определяется только абсолютной температурой газа и не зависит ни от объёма, ни от давления.",life:"Пока чай не остыл или не нагрелся, средняя энергия молекул воды в нём прежняя, в какую кружку его ни переливай."},
   {type:"formula",name:"Внутренняя энергия одноатомного газа",f:"<i>U</i> = (3/2)<i>νRT</i>",life:"Выпустил часть воздуха из баллона при той же температуре: молекул стало меньше, значит и внутренней энергии меньше."}
  ],
  qs:[
   {type:"rows",kind:"change",q:"Идеальный газ в закрытом сосуде постоянного объёма нагревают. Как изменятся давление газа и концентрация его молекул?",rows:["Давление газа","Концентрация молекул газа"],ans:[1,3],why:"V и масса газа постоянны, поэтому концентрация n = N/V не меняется. Давление p = nkT растёт вместе с T."},
   {type:"rows",kind:"change",q:"Идеальный газ медленно расширяют при постоянной температуре. Как изменятся давление газа и средняя кинетическая энергия его молекул?",rows:["Давление газа","Средняя кинетическая энергия молекул"],ans:[2,3],why:"T = const, поэтому Ē = 3kT/2 не меняется. По закону Бойля — Мариотта pV = const: объём растёт, давление падает."},
   {type:"rows",kind:"match",q:"Установите соответствие между физическими величинами и формулами для их расчёта. N — число молекул газа, V — объём, m — масса газа, ν — количество вещества, T — абсолютная температура, k — постоянная Больцмана, R — универсальная газовая постоянная.",rows:["Концентрация молекул газа","Средняя кинетическая энергия поступательного движения молекулы"],choices:["<i>m</i>/<i>V</i>","<i>N</i>/<i>V</i>","3<i>νRT</i>/2","3<i>kT</i>/2"],ans:[2,4],why:"n = N/V — число молекул в единице объёма. Ē = 3kT/2. Формула m/V — это плотность, а 3νRT/2 — внутренняя энергия газа."},
   {type:"rows",kind:"change",q:"Идеальный газ в цилиндре под лёгким подвижным поршнем нагревают, давление газа при этом остаётся постоянным. Как изменятся объём газа и его плотность?",rows:["Объём газа","Плотность газа"],ans:[1,2],why:"Изобарный процесс: V/T = const, объём растёт. Масса газа постоянна, ρ = m/V, поэтому плотность уменьшается."},
   {type:"rows",kind:"change",q:"Из закрытого жёсткого сосуда с идеальным газом через кран выпустили часть газа. Температура газа в сосуде поддерживается неизменной. Как изменятся давление газа в сосуде и его внутренняя энергия?",rows:["Давление газа","Внутренняя энергия газа"],ans:[2,2],why:"V и T постоянны, а число молекул уменьшилось: концентрация падает, p = nkT уменьшается. U = 3νRT/2 тоже уменьшается, так как ν стало меньше."},
   {type:"rows",kind:"change",q:"В закрытый сосуд постоянного объёма, содержащий идеальный газ, закачали ещё такой же газ. Температура газа не изменилась. Как изменятся концентрация молекул газа и его давление?",rows:["Концентрация молекул газа","Давление газа"],ans:[1,1],why:"Молекул в том же объёме стало больше: n = N/V растёт. При неизменной T давление p = nkT растёт вслед за n."},
   {type:"rows",kind:"match",q:"Установите соответствие между физическими величинами и формулами для их расчёта. m — масса газа, M — молярная масса, Nₐ — постоянная Авогадро, n — концентрация молекул, k — постоянная Больцмана, T — абсолютная температура, ν — количество вещества, R — универсальная газовая постоянная.",rows:["Число молекул в газе массой m","Давление идеального газа"],choices:["<i>nkT</i>","<i>mN</i><sub>A</sub>/<i>M</i>","<i>m</i>/<i>M</i>","<i>νRT</i>"],ans:[2,1],why:"Число молекул N = νNₐ = mNₐ/M. Давление идеального газа p = nkT. Формула m/M — это количество вещества, νRT — это произведение pV."},
   {type:"rows",kind:"change",q:"Идеальный газ в закрытом сосуде постоянного объёма охладили. Как изменятся плотность газа и его давление?",rows:["Плотность газа","Давление газа"],ans:[3,2],why:"Масса и объём не менялись, поэтому плотность ρ = m/V прежняя. Давление p ~ T при V = const, T уменьшилась, значит p уменьшилось."}
  ]}
];

   {type:"num",q:"Чайник включён в сеть напряжением 220 В, сила тока в нём 5 А. Какую работу совершает электрический ток за 2 минуты? Ответ дайте в килоджоулях.",unit:"кДж",ans:132,calc:"220*5*120/1000",why:"t = 120 с. A = UIt = 220 · 5 · 120 = 132 000 Дж = 132 кДж."},
   {type:"num",q:"Через нагревательный элемент сопротивлением 20 Ом течёт ток 3 А. Какая мощность выделяется на элементе? Ответ дайте в ваттах.",unit:"Вт",ans:180,calc:"3**2*20",why:"P = I²R = 3² · 20 = 180 Вт."},
   {type:"num",q:"На рисунке показана вольт-амперная характеристика резистора. Определите сопротивление резистора. Ответ дайте в килоомах.",svg:graph({pts:[[0,0],[10,5]],x:[0,12],y:[0,6],dx:2,dy:1,xl:"U, В",yl:"I, мА"}),unit:"кОм",ans:2,calc:"10/(5/1000)/1000",why:"R = U/I = 10 В / 0,005 А = 2000 Ом = 2 кОм."}
  ]},

{ id:"t12", num:12, title:"Сила Ампера и Лоренца, индукция, катушка", fmt:"ответ числом · 1 балл",
  lesson:[
   {p:"Задание 12 проверяет простейшие расчёты в магнитном поле: сила Ампера и сила Лоренца (часто в виде «во сколько раз изменится»), магнитный поток, ЭДС индукции, индуктивность и энергия катушки. Ответ — число."},
   {h:"Ловушки ЕГЭ"},
   {ul:["<b>Синус угла.</b> Обе силы зависят от угла между током (скоростью) и линиями индукции: при 90° синус равен 1, при 30° — 0,5.","<b>Квадрат тока.</b> Энергия катушки пропорциональна I²: ток в 3 раза больше — энергия в 9 раз больше.","<b>Единицы.</b> мТл, мГн, мс, см² — в СИ. Помни: 1 см² = 10⁻⁴ м².","<b>ЭДС — это скорость изменения.</b> Важно не само значение потока, а изменение потока за время, взятое по модулю."]},
   {h:"Как решать «во сколько раз»"},
   {ul:["<b>Выпиши формулу</b> и рядом подпиши, что и во сколько раз изменилось.","<b>Перемножь множители.</b> Ток ×2 и длина ÷4 дают 2 · ¼ = ½ — сила уменьшилась в 2 раза."]},
   {life:"Мотор электросамоката работает на силе Ампера: чем больше ток в обмотке, тем сильнее он тянет."}
  ],
  cards:[
   {type:"formula",name:"Сила Ампера",f:"<i>F</i> = <i>BIl</i> sin α",life:"Проводник с током между полюсами магнита отклоняется — так устроен простой электродвигатель."},
   {type:"formula",name:"Сила Лоренца",f:"<i>F</i> = |<i>q</i>|<i>vB</i> sin α",life:"Электронный пучок в старом ЭЛТ-телевизоре отклоняли магнитным полем катушек."},
   {type:"formula",name:"Магнитный поток",f:"Φ = <i>BS</i> cos α",life:"Поворачиваешь рамку в магнитном поле — поток через неё меняется от максимума, когда линии идут поперёк рамки, до нуля, когда вдоль."},
   {type:"formula",name:"Закон электромагнитной индукции",f:"|<i>ε</i><sub>инд</sub>| = |ΔΦ|/Δ<i>t</i>",life:"В беспроводной зарядке переменное поле меняет поток через катушку в телефоне, и в ней возникает ЭДС."},
   {type:"formula",name:"ЭДС самоиндукции",f:"|<i>ε</i><sub>си</sub>| = <i>L</i>|Δ<i>I</i>|/Δ<i>t</i>",life:"Если резко выдернуть вилку мощного двигателя из розетки, в обмотке возникает большая ЭДС, и проскакивает искра."},
   {type:"formula",name:"Энергия магнитного поля катушки",f:"<i>W</i> = <i>LI</i>²/2",life:"Дроссель в блоке питания накапливает энергию магнитного поля и сглаживает пульсации тока."},
   {type:"term",term:"Индуктивность",def:"Характеристика катушки: отношение магнитного потока через катушку к силе тока в ней; единица — генри (Гн).",life:"Катушка с железным сердечником имеет большую индуктивность, поэтому сильнее сопротивляется изменению тока."}
  ],
  qs:[
   {type:"num",q:"Прямой проводник с током расположен перпендикулярно линиям индукции однородного магнитного поля. Силу тока в проводнике увеличили в 2 раза, а длину проводника, находящуюся в поле, уменьшили в 4 раза. Индукцию поля не меняли. Во сколько раз уменьшилась сила Ампера?",unit:"раз",ans:2,calc:"4/2",why:"F = BIl. Ток ×2 и длина ÷4: сила умножается на 2/4 = ½. Сила уменьшилась в 2 раза."},
   {type:"num",q:"Плоский контур площадью 50 см² находится в однородном магнитном поле с индукцией 0,2 Тл. Угол между вектором индукции и нормалью к плоскости контура равен 60°. Найдите магнитный поток через контур. Ответ дайте в милливеберах.",unit:"мВб",ans:0.5,calc:"0.2*50e-4*0.5*1000",why:"S = 50 см² = 5·10⁻³ м². Φ = BS cos 60° = 0,2 · 5·10⁻³ · 0,5 = 5·10⁻⁴ Вб = 0,5 мВб."},
   {type:"num",q:"Индуктивность катушки 40 мГн, сила тока в ней 5 А. Найдите энергию магнитного поля катушки. Ответ дайте в джоулях.",unit:"Дж",ans:0.5,calc:"0.5*0.04*5**2",why:"W = LI²/2 = 0,04 · 5² / 2 = 0,5 Дж."},
   {type:"num",q:"Протон влетает в однородное магнитное поле со скоростью v перпендикулярно линиям индукции. Затем протон влетает в это же поле с той же скоростью под углом 30° к линиям индукции. Во сколько раз сила Лоренца в первом случае больше, чем во втором?",unit:"раз",ans:2,calc:"1/0.5",why:"F = qvB sin α. В первом случае sin 90° = 1, во втором sin 30° = 0,5. Отношение сил 1/0,5 = 2."},
   {type:"num",q:"Магнитный поток через замкнутый контур равномерно уменьшился с 8 мВб до 2 мВб за 30 мс. Найдите модуль ЭДС индукции в контуре. Ответ дайте в вольтах.",unit:"В",ans:0.2,calc:"(8e-3-2e-3)/30e-3",why:"|ΔΦ| = 8 − 2 = 6 мВб = 6·10⁻³ Вб, Δt = 0,03 с. ε = ΔΦ/Δt = 6·10⁻³ / 0,03 = 0,2 В."},
   {type:"num",q:"Проводник длиной 20 см с током 5 А расположен в однородном магнитном поле с индукцией 40 мТл под углом 30° к линиям индукции. Найдите модуль силы Ампера. Ответ дайте в миллиньютонах.",unit:"мН",ans:20,calc:"0.04*5*0.2*0.5*1000",why:"F = BIl sin α = 0,04 · 5 · 0,2 · 0,5 = 0,02 Н = 20 мН."},
   {type:"num",q:"Силу тока в катушке увеличили в 3 раза. Во сколько раз увеличилась энергия магнитного поля катушки?",unit:"раз",ans:9,calc:"3**2",why:"W = LI²/2 пропорциональна I². Ток ×3 — энергия ×9."},
   {type:"num",q:"Сила тока в катушке индуктивностью 50 мГн равномерно уменьшилась с 5 А до 1 А за 0,2 с. Найдите модуль ЭДС самоиндукции. Ответ дайте в вольтах.",unit:"В",ans:1,calc:"0.05*(5-1)/0.2",why:"|ΔI| = 5 − 1 = 4 А. ε = L·|ΔI|/Δt = 0,05 · 4 / 0,2 = 1 В."}
  ]},

{ id:"t13", num:13, title:"Электромагнитные колебания, плоское зеркало", fmt:"ответ числом · 1 балл",
  lesson:[
   {p:"Задание 13 проверяет две темы: электромагнитные колебания в контуре (период и частота по формуле Томсона и по графику) и отражение света в плоском зеркале. Ответ — число."},
   {h:"Ловушки ЕГЭ"},
   {ul:["<b>Корень.</b> Период пропорционален √(LC): индуктивность в 4 раза больше — период в 2 раза больше, а не в 4.","<b>Период и частота обратны.</b> Период вырос в 2 раза — частота упала в 2 раза.","<b>Угол к зеркалу или к нормали.</b> Угол падения отсчитывают от перпендикуляра. Если дан угол с плоскостью зеркала, вычти его из 90°.","<b>Изображение за зеркалом.</b> Оно лежит так же далеко за зеркалом, как предмет перед ним, поэтому между ними — удвоенное расстояние."]},
   {h:"Как читать график колебаний"},
   {ul:["<b>Период</b> — время одного полного колебания, например между двумя соседними максимумами.","<b>Частота</b> — "+F("ν = 1/<i>T</i>")+". Период в мкс — частота в МГц.","<b>Ось t в мкс.</b> Период 4 мкс — это 4·10⁻⁶ с."]},
   {life:"Подходишь в примерочной к зеркалу на 1 м — твоё отражение «стоит» в 1 м за стеклом, а до него от тебя 2 м."}
  ],
  cards:[
   {type:"formula",name:"Формула Томсона",f:"<i>T</i> = 2π√(<i>LC</i>)",life:"Радиоприёмник настраивают на станцию, меняя ёмкость конденсатора в контуре: меняется период, а значит, и частота приёма."},
   {type:"formula",name:"Связь периода и частоты",f:"ν = 1/<i>T</i>",life:"Радиостанция вещает на частоте 1 МГц — период колебаний в её контуре равен 1 мкс."},
   {type:"formula",name:"Закон отражения света",f:"<i>α</i> = <i>β</i>",life:"Солнечный зайчик от зеркальца: луч отражается под тем же углом, под каким падает."},
   {type:"formula",name:"Угол между падающим и отражённым лучами",f:"φ = 2<i>α</i>",life:"Если луч падает на зеркало перпендикулярно, он возвращается назад, и угол между лучами равен нулю."},
   {type:"term",term:"Изображение в плоском зеркале",def:"Мнимое, прямое, такого же размера; расположено за зеркалом на таком же расстоянии, как предмет перед ним.",life:"Стоишь в 1 м от зеркала в лифте — твой «двойник» виден в 1 м за стеклом."},
   {type:"term",term:"Колебания в контуре",def:"Периодические изменения заряда конденсатора и тока в катушке: энергия электрического поля переходит в энергию магнитного и обратно.",life:"Колебательный контур в радиопередатчике перекачивает энергию туда-обратно миллионы раз в секунду."},
   {type:"term",term:"Период по графику",def:"Расстояние по оси времени между двумя соседними одинаковыми точками графика, например максимумами.",life:"На экране осциллографа считают клетки между двумя соседними гребнями волны — это и есть период."}
  ],
  qs:[
   {type:"num",q:"В идеальном колебательном контуре индуктивность катушки увеличили в 16 раз, а ёмкость конденсатора уменьшили в 4 раза. Во сколько раз увеличился период свободных колебаний?",unit:"раз",ans:2,calc:"math.sqrt(16/4)",why:"T = 2π√(LC). Под корнем L·C умножается на 16/4 = 4, поэтому период увеличивается в √4 = 2 раза."},
   {type:"num",q:"На рисунке показан график зависимости силы тока в идеальном колебательном контуре от времени. Определите период колебаний. Ответ дайте в микросекундах.",svg:graph({pts:[[0,0],[1,7.1],[2,10],[3,7.1],[4,0],[5,-7.1],[6,-10],[7,-7.1],[8,0],[9,7.1],[10,10],[11,7.1],[12,0],[13,-7.1],[14,-10],[15,-7.1],[16,0]],x:[0,16],y:[-10,10],dx:2,dy:5,xl:"t, мкс",yl:"I, мА"}),unit:"мкс",ans:8,calc:"10-2",why:"Период — время одного полного колебания: график повторяется через 8 мкс (например, от одного максимума при t = 2 мкс до следующего при t = 10 мкс)."},
   {type:"num",q:"Луч света падает на плоское зеркало. Угол между падающим лучом и поверхностью зеркала равен 20°. Чему равен угол между падающим и отражённым лучами? Ответ дайте в градусах.",unit:"°",ans:140,calc:"2*(90-20)",why:"Угол падения отсчитывают от перпендикуляра: α = 90° − 20° = 70°. Угол отражения тоже 70°, угол между лучами 2α = 140°."},
   {type:"num",q:"К конденсатору идеального колебательного контура параллельно подключили ещё три таких же конденсатора. Во сколько раз уменьшилась частота свободных колебаний в контуре?",unit:"раз",ans:2,calc:"math.sqrt(4)",why:"При параллельном соединении ёмкости складываются: C становится в 4 раза больше. Период растёт в √4 = 2 раза, частота падает в 2 раза."},
   {type:"num",q:"Предмет находится на расстоянии 40 см от плоского зеркала. Предмет придвинули к зеркалу на 15 см. Каким стало расстояние между предметом и его изображением? Ответ дайте в сантиметрах.",unit:"см",ans:50,calc:"2*(40-15)",why:"Новое расстояние до зеркала 40 − 15 = 25 см. Изображение за зеркалом на таком же расстоянии, поэтому между предметом и изображением 2 · 25 = 50 см."},
   {type:"num",q:"На рисунке показан график зависимости напряжения на конденсаторе идеального колебательного контура от времени. Определите частоту колебаний. Ответ дайте в килогерцах.",svg:graph({pts:[[0,6],[0.5,4.2],[1,0],[1.5,-4.2],[2,-6],[2.5,-4.2],[3,0],[3.5,4.2],[4,6],[4.5,4.2],[5,0],[5.5,-4.2],[6,-6],[6.5,-4.2],[7,0],[7.5,4.2],[8,6]],x:[0,8],y:[-6,6],dx:1,dy:2,xl:"t, мкс",yl:"U, В"}),unit:"кГц",ans:250,calc:"1/(4e-6)/1000",why:"Соседние максимумы при t = 0 и t = 4 мкс: T = 4 мкс = 4·10⁻⁶ с. ν = 1/T = 250 000 Гц = 250 кГц."},
   {type:"num",q:"Индуктивность катушки идеального колебательного контура 1 мГн, ёмкость конденсатора 4 нФ. Найдите период свободных колебаний в контуре. Примите π = 3,14. Ответ дайте в микросекундах.",unit:"мкс",ans:12.56,calc:"2*3.14*math.sqrt(1e-3*4e-9)*1e6",why:"LC = 10⁻³ · 4·10⁻⁹ = 4·10⁻¹², √(LC) = 2·10⁻⁶ с. T = 2π√(LC) = 2 · 3,14 · 2·10⁻⁶ = 12,56·10⁻⁶ с = 12,56 мкс."},
   {type:"num",q:"Точечный источник света находится на расстоянии 30 см от плоского зеркала. Зеркало отодвинули от источника на 10 см (источник не двигали). Каким стало расстояние между источником и его изображением? Ответ дайте в сантиметрах.",unit:"см",ans:80,calc:"2*(30+10)",why:"Расстояние от источника до зеркала стало 30 + 10 = 40 см. Изображение на таком же расстоянии за зеркалом, поэтому между источником и изображением 2 · 40 = 80 см."}
  ]},

{ id:"t14", num:14, title:"Анализ электрических процессов: верные утверждения", fmt:"выбор утверждений · 2 балла",
  lesson:[
   {p:"Задание 14 даёт описание процесса или график и пять утверждений. Нужно выбрать все верные (их 2 или 3). Проверяются цепи постоянного тока, конденсаторы, магнитное поле, электромагнитная индукция и колебательный контур."},
   {h:"Ловушки ЕГЭ"},
   {ul:["<b>Проверяй каждое утверждение отдельно.</b> «Похоже на правду» — не аргумент: подставь числа или выпиши формулу.","<b>Что остаётся постоянным.</b> Конденсатор отключён от источника — постоянен заряд; подключён — постоянно напряжение.","<b>Последовательно и параллельно.</b> При последовательном соединении одинакова сила тока, при параллельном — напряжение.","<b>Индукционный ток есть, только пока поток меняется.</b> Неподвижный магнит в катушке тока не создаёт.","<b>Слова «только» и «всегда».</b> Достаточно одного примера, где это не так, — и утверждение неверно."]},
   {h:"Как читать график"},
   {ul:["<b>Колебательный контур.</b> Заряд конденсатора максимален — ток равен нулю; заряд равен нулю — ток максимален.","<b>I(U).</b> Прямая через начало координат — закон Ома, сопротивление R = U/I.","<b>Числа с графика.</b> Прочитай точку графика и сразу проверь утверждение: например, мощность — это U · I в этой точке."]},
   {life:"Динамический микрофон работает на индукции: пока мембрана с катушкой колеблется в поле магнита, ток есть, остановилась — тока нет."}
  ],
  cards:[
   {type:"formula",name:"Последовательное соединение",f:"<i>R</i> = <i>R</i><sub>1</sub> + <i>R</i><sub>2</sub>, <i>I</i><sub>1</sub> = <i>I</i><sub>2</sub>",life:"Лампочки в старой ёлочной гирлянде включены друг за другом: через все течёт один и тот же ток."},
   {type:"formula",name:"Параллельное соединение",f:"<i>U</i><sub>1</sub> = <i>U</i><sub>2</sub>, 1/<i>R</i> = 1/<i>R</i><sub>1</sub> + 1/<i>R</i><sub>2</sub>",life:"Приборы в розетках квартиры включены параллельно: на каждом одинаковое напряжение 220 В."},
   {type:"formula",name:"Ёмкость плоского конденсатора",f:"<i>C</i> = ε<sub>0</sub>ε<i>S</i>/<i>d</i>",life:"Палец у сенсорного экрана меняет ёмкость в точке касания — так телефон находит, куда ты нажал."},
   {type:"formula",name:"Энергия конденсатора",f:"<i>W</i> = <i>q</i>²/(2<i>C</i>)",life:"Вспышка фотоаппарата питается от заряженного конденсатора, который за долю секунды отдаёт накопленную энергию."},
   {type:"formula",name:"Радиус траектории частицы в магнитном поле",f:"<i>R</i> = <i>mv</i>/(|<i>q</i>|<i>B</i>)",life:"В масс-спектрометре по радиусу траектории частицы определяют её массу."},
   {type:"term",term:"Правило Ленца",def:"Индукционный ток направлен так, что его магнитное поле противодействует изменению магнитного потока, вызвавшему этот ток.",life:"Магнит падает сквозь медную трубку медленнее, чем сквозь пластиковую: индукционные токи в меди его тормозят."},
   {type:"term",term:"Энергия в колебательном контуре",def:"Полная энергия контура постоянна: энергия электрического поля конденсатора переходит в энергию магнитного поля катушки и обратно.",life:"Аналог — качели без трения: в крайней точке вся энергия потенциальная (как у заряженного конденсатора), в нижней — кинетическая (как у катушки с током)."}
  ],
  qs:[
   {type:"multi",q:"Два резистора сопротивлениями 10 Ом и 20 Ом соединены последовательно и подключены к идеальному источнику постоянного напряжения 6 В. Выберите все верные утверждения.",opts:["Общее сопротивление цепи равно 30 Ом.","Напряжение на резисторе 20 Ом равно 2 В.","Сила тока в цепи равна 0,6 А.","Мощность тока в резисторе 20 Ом в 2 раза больше, чем в резисторе 10 Ом.","Напряжения на резисторах одинаковы."],ans:[0,3],why:"R = 10 + 20 = 30 Ом, I = 6/30 = 0,2 А (не 0,6 А). Напряжение на 20 Ом равно 0,2 · 20 = 4 В (не 2 В), на 10 Ом — 2 В, значит напряжения разные. Ток один, P = I²R, поэтому мощность на большем сопротивлении в 2 раза больше."},
   {type:"multi",q:"На рисунке показан график зависимости силы тока в проводнике от напряжения на его концах. Выберите все верные утверждения.",svg:graph({pts:[[0,0],[12,3]],x:[0,14],y:[0,4],dx:2,dy:1,xl:"U, В",yl:"I, А"}),opts:["При напряжении 6 В сила тока в проводнике равна 1 А.","Сопротивление проводника равно 4 Ом.","Сопротивление проводника увеличивается с ростом напряжения.","При напряжении 8 В мощность тока в проводнике равна 16 Вт.","При силе тока 3 А напряжение на проводнике равно 12 В."],ans:[1,3,4],why:"График — прямая, R = U/I = 12/3 = 4 Ом и не меняется. При 6 В ток 1,5 А (не 1 А). При 8 В ток 2 А, P = UI = 16 Вт. Точка (12 В; 3 А) лежит на графике."},
   {type:"multi",q:"Плоский воздушный конденсатор зарядили и отключили от источника, а затем увеличили расстояние между его обкладками. Выберите все верные утверждения.",opts:["Ёмкость конденсатора увеличилась.","Заряд на обкладках конденсатора не изменился.","Напряжённость электрического поля между обкладками уменьшилась.","Напряжение между обкладками конденсатора увеличилось.","Энергия электрического поля конденсатора уменьшилась."],ans:[1,3],why:"Конденсатор отключён, поэтому заряд q постоянен. C = ε₀S/d уменьшилась, U = q/C выросло, W = q²/(2C) выросла. Напряжённость E = q/(ε₀S) не изменилась."},
   {type:"multi",q:"На рисунке показан график зависимости заряда одной из обкладок конденсатора идеального колебательного контура от времени. Выберите все верные утверждения.",svg:graph({pts:[[0,8],[1,5.66],[2,0],[3,-5.66],[4,-8],[5,-5.66],[6,0],[7,5.66],[8,8]],x:[0,9],y:[-8,8],dx:1,dy:2,xl:"t, мкс",yl:"q, нКл"}),opts:["Период колебаний заряда конденсатора равен 8 мкс.","В момент времени t = 2 мкс энергия электрического поля конденсатора максимальна.","В момент времени t = 4 мкс сила тока в катушке максимальна.","Частота колебаний равна 8 кГц.","В момент времени t = 2 мкс энергия магнитного поля катушки максимальна."],ans:[0,4],why:"Соседние максимумы при t = 0 и t = 8 мкс: T = 8 мкс, частота 1/T = 125 кГц (не 8 кГц). При t = 2 мкс заряд равен нулю: вся энергия в катушке, ток максимален. При t = 4 мкс заряд максимален по модулю, ток равен нулю."},
   {type:"multi",q:"Полосовой магнит вдвигают в замкнутую катушку, затем выдвигают из неё. Катушка соединена с гальванометром. Выберите все верные утверждения.",opts:["Индукционный ток возникает только при вдвигании магнита, при выдвигании тока нет.","Пока магнит движется относительно катушки, в ней возникает ЭДС индукции.","Чем быстрее движется магнит, тем больше ЭДС индукции.","При вдвигании и выдвигании магнита индукционный ток направлен одинаково.","Если магнит неподвижен внутри катушки, в ней течёт постоянный индукционный ток."],ans:[1,2],why:"ЭДС возникает при любом изменении потока — и при вдвигании, и при выдвигании. ε = ΔΦ/Δt: чем быстрее движется магнит, тем она больше. По правилу Ленца направления тока в этих случаях противоположны. Если магнит неподвижен, поток не меняется и тока нет."},
   {type:"multi",q:"Протон влетает в однородное магнитное поле перпендикулярно линиям индукции. Силой тяжести можно пренебречь. Выберите все верные утверждения.",opts:["Сила Лоренца направлена вдоль вектора скорости протона.","Траектория протона в магнитном поле — окружность.","Период обращения протона не зависит от его скорости.","При увеличении скорости протона в 2 раза радиус окружности уменьшится в 2 раза.","Кинетическая энергия протона при движении не изменяется."],ans:[1,2,4],why:"Сила Лоренца перпендикулярна скорости и работы не совершает: скорость и энергия постоянны, траектория — окружность. R = mv/(qB) растёт с v (при v ×2 радиус увеличится в 2 раза), а T = 2πm/(qB) от скорости не зависит."}
  ]},

{ id:"t15", num:15, title:"Как изменятся величины в цепях и полях", fmt:"две цифры · 2 балла",
  lesson:[
   {p:"Задание 15 проверяет, как изменятся две величины при изменении одного параметра. В ответе две цифры: 1 — увеличится, 2 — уменьшится, 3 — не изменится; цифры могут повторяться. Второй тип — соответствие между величинами и формулами."},
   {h:"Ловушки ЕГЭ"},
   {ul:["<b>Сначала — что постоянно.</b> Источник подключён — постоянно напряжение; конденсатор отключён — постоянен заряд.","<b>Одна величина — одна формула.</b> Выпиши формулу для каждой величины и смотри, что в ней меняется.","<b>Порядок цифр.</b> Цифры идут в том же порядке, что и величины в условии.","<b>«Не изменится» — тоже ответ.</b> Ёмкость конденсатора не зависит от заряда и напряжения, индуктивность — от тока.","<b>Сомневаешься — подставь числа.</b> Возьми сопротивление 2 Ом вместо 1 Ом и посчитай обе величины до и после."]},
   {h:"От чего что зависит"},
   {ul:["<b>Ёмкость.</b> Площадь пластин, расстояние между ними, диэлектрик.","<b>Сопротивление проводника.</b> Материал, длина, площадь сечения.","<b>Период контура.</b> Только индуктивность и ёмкость.","<b>Радиус траектории частицы.</b> Масса, скорость, заряд и индукция; период обращения от скорости не зависит."]},
   {life:"Ручкой старого радиоприёмника меняют ёмкость конденсатора в контуре: меняется период колебаний, и приёмник ловит другую станцию."}
  ],
  cards:[
   {type:"formula",name:"Ёмкость плоского конденсатора",f:"<i>C</i> = ε<sub>0</sub>ε<i>S</i>/<i>d</i>",life:"Поворачиваешь ручку старого радиоприёмника — меняется площадь перекрытия пластин переменного конденсатора, а с ней и ёмкость."},
   {type:"formula",name:"Заряд, напряжение и ёмкость",f:"<i>C</i> = <i>q</i>/<i>U</i>",life:"Чем больше ёмкость конденсатора, тем больший заряд он накопит при том же напряжении зарядки."},
   {type:"formula",name:"Энергия конденсатора",f:"<i>W</i> = <i>q</i>²/(2<i>C</i>) = <i>CU</i>²/2",life:"Вспышка фотоаппарата: чем выше напряжение зарядки конденсатора, тем больше энергия вспышки."},
   {type:"formula",name:"Сопротивление проводника",f:"<i>R</i> = ρ<i>l</i>/<i>S</i>",life:"Тонкий и длинный провод удлинителя греется сильнее, чем короткий и толстый, — его сопротивление больше."},
   {type:"formula",name:"Период колебаний в контуре",f:"<i>T</i> = 2π√(<i>LC</i>)",life:"Настройка радио: вращаешь ручку, меняется ёмкость, меняется период колебаний — и приёмник ловит другую частоту."},
   {type:"formula",name:"Радиус траектории в магнитном поле",f:"<i>R</i> = <i>mv</i>/(|<i>q</i>|<i>B</i>)",life:"Быстрые частицы в ускорителе чертят окружность большего радиуса, чем медленные."},
   {type:"formula",name:"Период обращения частицы",f:"<i>T</i> = 2π<i>m</i>/(|<i>q</i>|<i>B</i>)",life:"В циклотроне частицы разгоняются, а время одного оборота остаётся тем же — на этом держится его работа."}
  ],
  qs:[
   {type:"rows",kind:"change",q:"Плоский воздушный конденсатор зарядили и отключили от источника. Затем пространство между обкладками заполнили диэлектриком с ε > 1. Как изменятся напряжение между обкладками конденсатора и энергия его электрического поля?",rows:["Напряжение между обкладками","Энергия электрического поля конденсатора"],ans:[2,2],why:"Заряд q постоянен, ёмкость растёт (C ~ ε). U = q/C уменьшается, W = q²/(2C) тоже уменьшается."},
   {type:"rows",kind:"match",q:"Установите соответствие между физическими величинами и формулами для их расчёта. К каждой позиции первого столбца подберите соответствующую позицию второго.",rows:["Мощность электрического тока","Энергия магнитного поля катушки с током"],choices:["<i>UIt</i>","<i>UI</i>","<i>LI</i>²/2","<i>BIl</i>"],ans:[2,3],why:"P = UI. W = LI²/2. Формула UIt — это работа тока, BIl — сила Ампера."},
   {type:"rows",kind:"change",q:"К резистору, подключённому к идеальному источнику постоянного напряжения, параллельно подключили такой же резистор. Как изменятся общее сопротивление цепи и мощность тока, потребляемая от источника?",rows:["Общее сопротивление цепи","Мощность тока, потребляемая от источника"],ans:[2,1],why:"Два одинаковых резистора параллельно: R_общ = R/2, сопротивление уменьшилось. P = U²/R_общ при постоянном U — мощность увеличилась (в 2 раза)."},
   {type:"rows",kind:"change",q:"Проволоку, подключённую к источнику постоянного напряжения, равномерно вытянули: её длина увеличилась, а площадь поперечного сечения уменьшилась (материал и температура те же). Как изменятся сопротивление проволоки и сила тока в ней?",rows:["Сопротивление проволоки","Сила тока в проволоке"],ans:[1,2],why:"R = ρl/S: длина больше, сечение меньше — сопротивление увеличилось. I = U/R при постоянном U — сила тока уменьшилась."},
   {type:"rows",kind:"change",q:"В катушку колебательного контура вдвинули железный сердечник, при этом индуктивность катушки увеличилась. Как изменятся период свободных колебаний и длина электромагнитной волны, излучаемой контуром?",rows:["Период свободных колебаний","Длина излучаемой волны"],ans:[1,1],why:"T = 2π√(LC): индуктивность растёт — период растёт. λ = cT: период больше — длина волны тоже больше."},
   {type:"rows",kind:"match",q:"Установите соответствие между физическими величинами и формулами для их расчёта. К каждой позиции первого столбца подберите соответствующую позицию второго.",rows:["Сила Ампера (проводник перпендикулярен линиям индукции)","Период свободных колебаний в идеальном контуре"],choices:["2π√(<i>LC</i>)","<i>qvB</i>","<i>BIl</i>","1/(2π√(<i>LC</i>))"],ans:[3,1],why:"F = BIl; T = 2π√(LC). Формула 4 — частота колебаний, qvB — сила Лоренца."},
   {type:"rows",kind:"change",q:"Электрон движется в однородном магнитном поле по окружности (скорость перпендикулярна линиям индукции). Скорость электрона увеличили, индукцию поля не меняли. Как изменятся радиус траектории и период обращения электрона?",rows:["Радиус траектории","Период обращения"],ans:[1,3],why:"R = mv/(eB): скорость растёт — радиус растёт. T = 2πm/(eB) от скорости не зависит, период не изменится."},
   {type:"rows",kind:"change",q:"Силу тока в катушке без сердечника уменьшили. Как изменятся энергия магнитного поля катушки и её индуктивность?",rows:["Энергия магнитного поля катушки","Индуктивность катушки"],ans:[2,3],why:"W = LI²/2: ток меньше — энергия меньше. Индуктивность зависит от размеров и числа витков катушки, но не от тока, поэтому не изменится."}
  ]}

   {p:"Задание 16 проверяет строение атома и ядра, радиоактивный распад и ядерные реакции. Нужно посчитать число частиц или найти массовое либо зарядовое число. Ответ — число."},
   {h:"Правила для распадов и реакций"},

   {life:"Радиоактивный йод-131, который используют в медицине, теряет половину ядер за 8 суток, поэтому через месяц от первоначальной дозы остаётся лишь несколько процентов."}

   {type:"formula",name:"Число нейтронов в ядре",f:"<i>N</i><sub>нейтр</sub> = <i>A</i> − <i>Z</i>",life:"У ядра углерода-14 (A = 14, Z = 6) нейтронов 14 − 6 = 8; по распаду таких ядер определяют возраст древних находок."},
   {type:"term",term:"Массовое и зарядовое числа",def:"Массовое число A — это число нуклонов в ядре, зарядовое число Z — число протонов; в нейтральном атоме Z равно числу электронов.",life:"Номер элемента в таблице Менделеева — это Z: в атоме железа 26 протонов и в нейтральном атоме 26 электронов."},
   {type:"term",term:"Период полураспада",def:"Время, за которое распадается половина имеющихся радиоактивных ядер.",life:"У радона из плохо проветриваемого подвала период полураспада около 4 суток: через 4 суток его ядер остаётся вдвое меньше."},
   {type:"term",term:"α-распад",def:"Распад, при котором ядро испускает ядро гелия ⁴₂He: массовое число уменьшается на 4, зарядовое — на 2.",life:"В дымовом датчике пожарной сигнализации немного америция-241 испускает α-частицы, которые ионизируют воздух между пластинами."},
   {type:"term",term:"β⁻-распад",def:"Распад, при котором нейтрон ядра превращается в протон с испусканием электрона: массовое число не меняется, зарядовое растёт на 1.",life:"Радиоактивный калий-40 в бананах в основном распадается с испусканием электрона и превращается в кальций-40: Z растёт с 19 до 20."},
   {type:"term",term:"Сохранение чисел в ядерной реакции",def:"Сумма массовых чисел и сумма зарядовых чисел до реакции равны соответствующим суммам после неё.",life:"В реакторе атомной станции ядро урана-235 делится на осколки и нейтроны, но число нуклонов и суммарный заряд при этом не меняются."}
