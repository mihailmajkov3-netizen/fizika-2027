  qs:[
   {type:"num",q:"Атом кальция ⁴⁰₂₀Ca потерял два электрона и стал ионом Ca²⁺. Сколько электронов содержит этот ион?",unit:"электронов",ans:18,calc:"20-2",why:"В нейтральном атоме электронов столько же, сколько протонов: Z = 20. Два электрона потеряны: 20 − 2 = 18."},
   {type:"num",q:"Ядро тория ²³⁴₉₀Th (Z = 90) испытывает электронный β-распад. Каков заряд Z образовавшегося ядра (в единицах элементарного заряда)?",unit:"",ans:91,calc:"90+1",why:"При β⁻-распаде нейтрон превращается в протон: Z растёт на 1. Получаем 90 + 1 = 91 (ядро протактиния)."},
   {type:"num",q:"В образце содержится 1600 ядер радиоактивного изотопа с периодом полураспада 4 суток. Сколько ядер этого изотопа останется нераспавшимися через 12 суток?",unit:"ядер",ans:200,calc:"1600/2**(12/4)",why:"Число периодов n = 12/4 = 3. N = N₀/2ⁿ = 1600/8 = 200."},
   {type:"num",q:"На рисунке показана зависимость числа N нераспавшихся ядер радиоактивного изотопа от времени t. Определите период полураспада этого изотопа.",svg:graph({pts:[[0,80],[8,40],[16,20],[24,10],[32,5]],x:[0,32],y:[0,80],dx:4,dy:10,xl:"t, с",yl:"N, 10⁶"}),unit:"с",ans:8,calc:"8-0",why:"Сначала N₀ = 80·10⁶. Вдвое меньше, 40·10⁶, число ядер становится при t = 8 с. Значит, T = 8 с."},
   {type:"num",q:"Масса образца радиоактивного изотопа 160 мг, период полураспада 5 суток. Сколько миллиграммов этого изотопа распадётся за 15 суток?",unit:"мг",ans:140,calc:"160-160/2**(15/5)",why:"За 15 суток проходит n = 15/5 = 3 периода, остаётся 160/8 = 20 мг. Распадётся 160 − 20 = 140 мг."},
   {type:"num",q:"Ядро азота ¹⁴₇N поглощает α-частицу ⁴₂He и испускает протон ¹₁H, превращаясь в ядро X: ¹⁴₇N + ⁴₂He → X + ¹₁H. Чему равно массовое число ядра X?",unit:"",ans:17,calc:"14+4-1",why:"Сумма массовых чисел сохраняется: 14 + 4 = A + 1, откуда A = 17. Зарядовое число Z = 7 + 2 − 1 = 8, это кислород ¹⁷₈O."},
   {type:"num",q:"При делении ядра урана-235 нейтроном идёт реакция ²³⁵₉₂U + ¹₀n → ¹⁴¹₅₆Ba + ⁹²₃₆Kr + k·¹₀n. Сколько нейтронов k образуется в этой реакции?",unit:"нейтронов",ans:3,calc:"235+1-141-92",why:"Сумма массовых чисел слева 235 + 1 = 236, справа 141 + 92 + k. Из 236 = 233 + k получаем k = 3. Заряды сошлись: 92 = 56 + 36."},
   {type:"num",q:"Ядро ²³⁸₉₂U испытывает два α-распада и один β⁻-распад. Сколько нейтронов содержится в образовавшемся ядре?",unit:"нейтронов",ans:141,calc:"(238-2*4)-(92-2*2+1)",why:"Массовое число: 238 − 2·4 = 230. Заряд: 92 − 2·2 + 1 = 89. Нейтронов: A − Z = 230 − 89 = 141."}
  ]},

{ id:"t17", num:17, title:"Фотоэффект и энергетические уровни", fmt:"две цифры · 2 балла",
  lesson:[
   {p:"Задание 17 — на соответствие. Бывает два вида: как меняются величины при фотоэффекте и какая энергия у фотона при переходе атома между уровнями. Ответ — две цифры подряд."},
   {h:"Что от чего зависит при фотоэффекте"},
   {ul:["<b>От частоты света:</b> энергия фотона, максимальная кинетическая энергия электронов, запирающее напряжение.","<b>От числа фотонов (интенсивности):</b> число фотоэлектронов в секунду и фототок насыщения.","<b>От металла:</b> работа выхода и красная граница. Свет их не меняет."]},
   {h:"Ловушки ЕГЭ"},
   {ul:["<b>Мощность та же, частота выросла.</b> Фотонов в секунду стало меньше: "+F("<i>N</i> = <i>P</i>/(<i>hν</i>)")+".","<b>Выше частота — не больше электронов.</b> Если число фотонов в секунду то же, число фотоэлектронов не изменилось.","<b>Вниз — излучение, вверх — поглощение.</b> Энергия фотона — модуль разности уровней. Уровни отрицательные, считай со знаками.","<b>Длина волны наоборот.</b> Длина волны больше — частота и энергия фотона меньше.","<b>Красная граница в длинах волн.</b> Работа выхода больше — минимальная частота больше, а предельная длина волны меньше."]},
   {life:"В фотоэлементе чем ярче свет, тем больше ток, а скорость вылетающих электронов задаёт только цвет света."}
  ],
  cards:[
   {type:"formula",name:"Энергия фотона",f:"<i>E</i> = <i>hν</i> = <i>hc</i>/<i>λ</i>",life:"Фотон ультрафиолета энергичнее фотона красного света, поэтому загар вызывает именно ультрафиолет, а красная лампа нет."},
   {type:"formula",name:"Уравнение Эйнштейна для фотоэффекта",f:"<i>hν</i> = <i>A</i><sub>вых</sub> + <i>E</i><sub>к.max</sub>",life:"Энергия фотона делится: часть тратится на выход электрона из металла, остальное уходит в его скорость."},
   {type:"formula",name:"Красная граница фотоэффекта",f:"<i>ν</i><sub>min</sub> = <i>A</i><sub>вых</sub>/<i>h</i>",life:"Если фотон слабее работы выхода, то хоть залей металл красным светом, электроны не вылетят, как мяч, брошенный слишком слабо, не перелетит забор."},
   {type:"formula",name:"Запирающее напряжение",f:"<i>eU</i><sub>з</sub> = <i>E</i><sub>к.max</sub>",life:"Запирающее напряжение работает как встречный ветер, который останавливает даже самого быстрого велосипедиста."},
   {type:"formula",name:"Энергия фотона при переходе атома",f:"<i>hν</i> = |<i>E</i><sub>m</sub> − <i>E</i><sub>n</sub>|",life:"Светодиод в гирлянде излучает фотоны строго определённой энергии, поэтому светит одним цветом."},
   {type:"term",term:"Фототок насыщения",def:"Наибольшая сила тока в фотоэлементе при данном свете, когда все вылетевшие за секунду электроны достигают анода; он пропорционален числу падающих фотонов.",life:"Заменил тусклую лампу яркой: фототок вырос, потому что фотонов стало больше, а энергия каждого фотона осталась прежней."},
   {type:"term",term:"Излучение и поглощение света атомом",def:"Атом излучает фотон при переходе на более низкий энергетический уровень и поглощает фотон при переходе на более высокий.",life:"Неоновая реклама светится красно-оранжевым светом: возбуждённые атомы неона переходят на нижние уровни и излучают фотоны."}
  ],
  qs:[
   {type:"rows",kind:"change",q:"На металлическую пластину падает монохроматический свет, вызывающий фотоэффект. Частоту света увеличили, число фотонов, падающих на пластину за 1 с, не изменилось. Как изменятся максимальная кинетическая энергия фотоэлектронов и число фотоэлектронов, вылетающих за 1 с?",rows:["Максимальная кинетическая энергия фотоэлектронов","Число фотоэлектронов, вылетающих за 1 с"],ans:[1,3],why:"hν = A + Eк: частота выросла, работа выхода та же, значит Eк растёт. Фотонов в секунду столько же, поэтому и электронов в секунду столько же."},
   {type:"rows",kind:"change",q:"Интенсивность монохроматического света, падающего на пластину, увеличили в 2 раза. Частота света не изменилась, фотоэффект наблюдается. Как изменятся запирающее напряжение и фототок насыщения?",rows:["Запирающее напряжение","Фототок насыщения"],ans:[3,1],why:"eUз = hν − A: частота та же, поэтому запирающее напряжение не меняется. Фотонов стало вдвое больше, значит, фотоэлектронов и фототок насыщения больше."},
   {type:"rows",kind:"match",q:"Уровни энергии атома: E₁ = −13,6 эВ (основное состояние), E₂ = −3,4 эВ, E₃ = −1,5 эВ. Установите соответствие между процессами и энергиями фотонов, которые излучаются или поглощаются.",rows:["Излучение при переходе с уровня E₃ на уровень E₂","Поглощение при переходе с уровня E₁ на уровень E₂"],choices:["10,2 эВ","12,1 эВ","1,9 эВ","13,6 эВ"],ans:[3,1],why:"Излучение E₃ → E₂: −1,5 − (−3,4) = 1,9 эВ. Поглощение E₁ → E₂: −3,4 − (−13,6) = 10,2 эВ."},
   {type:"rows",kind:"change",q:"Длину волны света, облучающего металлическую пластину, увеличили. Фотоэффект продолжает наблюдаться, число фотонов за 1 с не изменилось. Как изменятся энергия фотона и запирающее напряжение?",rows:["Энергия фотона","Запирающее напряжение"],ans:[2,2],why:"E = hc/λ: длина волны больше, значит, энергия фотона меньше. eUз = E − A: энергия фотона меньше при той же работе выхода, значит, запирающее напряжение меньше."},
   {type:"rows",kind:"change",q:"Пластину из одного металла заменили пластиной из другого металла с большей работой выхода. Свет прежний, фотоэффект наблюдается. Как изменятся максимальная кинетическая энергия фотоэлектронов и минимальная частота света, при которой возможен фотоэффект?",rows:["Максимальная кинетическая энергия фотоэлектронов","Минимальная частота света, при которой возможен фотоэффект"],ans:[2,1],why:"Eк = hν − A: работа выхода больше, значит, Eк меньше. νmin = A/h: работа выхода больше, значит, минимальная частота больше."},
   {type:"rows",kind:"match",q:"Уровни энергии атома: E₁ = −8 эВ, E₂ = −3 эВ, E₃ = −1 эВ. Установите соответствие между переходами атома и процессами, которые при них происходят.",rows:["Переход с уровня E₂ на уровень E₁","Переход с уровня E₂ на уровень E₃"],choices:["излучение фотона с энергией 5 эВ","поглощение фотона с энергией 5 эВ","излучение фотона с энергией 2 эВ","поглощение фотона с энергией 2 эВ"],ans:[1,4],why:"E₂ → E₁ идёт вниз, значит, фотон излучается: −3 − (−8) = 5 эВ. E₂ → E₃ идёт вверх, значит, фотон поглощается: −1 − (−3) = 2 эВ."},
   {type:"rows",kind:"change",q:"Частоту света, облучающего металлическую пластину, увеличили, мощность светового потока оставили прежней. Фотоэффект наблюдается и до, и после. Доля фотонов, выбивающих электроны, не меняется. Как изменятся энергия фотона и фототок насыщения?",rows:["Энергия фотона","Фототок насыщения"],ans:[1,2],why:"E = hν растёт. Мощность P = N·hν прежняя, значит, число фотонов в секунду N = P/(hν) уменьшилось. Фотоэлектронов в секунду меньше, и фототок насыщения меньше."},
   {type:"rows",kind:"match",q:"Уровни энергии атома: E₁ = −9 эВ (основное состояние), E₂ = −4 эВ, E₃ = −2 эВ. Установите соответствие между физическими величинами и их значениями.",rows:["Наименьшая энергия фотона, который может поглотить атом в основном состоянии E₁","Наибольшая энергия фотона, который может излучить атом, находящийся на уровне E₃"],choices:["2 эВ","5 эВ","7 эВ","9 эВ"],ans:[2,3],why:"Из E₁ атом может уйти на E₂ (−4 − (−9) = 5 эВ) или на E₃ (7 эВ), наименьшая энергия 5 эВ. С E₃ атом может перейти на E₂ (2 эВ) или на E₁ (−2 − (−9) = 7 эВ), наибольшая энергия 7 эВ."}
  ]},

{ id:"t18", num:18, title:"Верные утверждения по всем разделам", fmt:"выбор утверждений · 2 балла",
  lesson:[
   {p:"Задание 18 — пять утверждений по разным разделам: 1-е — механика, 2-е — молекулярная физика, 3-е и 4-е — электродинамика, 5-е — квантовая физика. Верных два или три. Ответ — номера верных утверждений."},
   {h:"Ловушки ЕГЭ"},
   {ul:["<b>Слова «всегда», «любой», «только».</b> Достаточно одного исключения, и утверждение неверно.","<b>Зависит или не зависит.</b> Сила трения скольжения не зависит от площади, период маятника — от массы груза, энергия фотоэлектронов — от интенсивности света.","<b>Степень в формуле.</b> Кинетическая энергия растёт как v², энергия пружины — как x², мощность тока — как I². Не в первой степени.","<b>Направление.</b> Излучение — переход вниз, β⁻-распад увеличивает Z, сила Лоренца перпендикулярна скорости."]},
   {h:"Как решать"},
   {ul:["Проверяй каждое утверждение отдельно, не сравнивай их друг с другом.","Сомневаешься — вспомни формулу и посмотри, от чего величина зависит.","В газовых законах температура только в кельвинах: давление пропорционально T, а не t в градусах Цельсия."]},
   {life:"На кухне вода в кастрюле не становится горячее 100 °C, сколько ни увеличивай огонь: температура кипения постоянна, а лишняя энергия уходит на образование пара."}
  ],
  cards:[
   {type:"term",term:"Сила трения скольжения",def:"Сила, возникающая при скольжении одного тела по другому: она пропорциональна силе нормального давления и не зависит от площади соприкосновения.",life:"Кирпич тянется по полу с одинаковой силой, лежит он плашмя или стоит на ребре."},
   {type:"term",term:"Закон сохранения импульса",def:"Суммарный импульс замкнутой системы тел не изменяется при любых взаимодействиях тел внутри системы.",life:"Когда ты спрыгиваешь с лодки на берег, лодка отплывает назад: импульс системы человек плюс лодка остаётся прежним."},
   {type:"term",term:"Постоянство температуры при плавлении и кипении",def:"Пока вещество плавится или кипит, его температура не меняется, а подводимая энергия увеличивает внутреннюю энергию вещества.",life:"Лёд в стакане с водой тает при 0 °C, и пока он не растаял, вода не становится теплее."},
   {type:"term",term:"Насыщенный пар",def:"Пар, находящийся в равновесии со своей жидкостью: его давление при данной температуре не зависит от занимаемого объёма.",life:"Над водой в закрытой бутылке пар насыщенный: его давление определяется температурой, а не размером бутылки."},
   {type:"term",term:"Сила Лоренца",def:"Сила, действующая со стороны магнитного поля на движущуюся заряженную частицу: она перпендикулярна скорости, поэтому работу не совершает.",life:"В кинескопе старого телевизора магнитное поле отклоняло пучок электронов, но не разгоняло и не тормозило его."},
   {type:"term",term:"Электромагнитная индукция",def:"Возникновение тока в замкнутом проводящем контуре при изменении магнитного потока через контур.",life:"При беспроводной зарядке меняющееся магнитное поле катушки зарядки наводит ток в катушке внутри телефона."},
   {type:"term",term:"Фотон и энергия фотоэлектронов",def:"Энергия фотона пропорциональна частоте света; максимальная кинетическая энергия фотоэлектронов зависит от частоты, а не от интенсивности света.",life:"Красная подсветка в фотолаборатории не засвечивает фотобумагу: энергии красных фотонов не хватает, а яркость лампы тут ни при чём."}
  ],
  qs:[
   {type:"multi",q:"Выберите все верные утверждения о физических явлениях, величинах и закономерностях.",opts:["Если равнодействующая сил, приложенных к телу, равна нулю, то в инерциальной системе отсчёта тело покоится или движется равномерно и прямолинейно.","При плавлении кристаллического вещества его температура не изменяется, а внутренняя энергия увеличивается.","Индукционный ток в замкнутом проводящем контуре возникает и при неизменном магнитном потоке через контур.","При последовательном соединении проводников сила тока во всех проводниках одинакова.","Максимальная кинетическая энергия фотоэлектронов пропорциональна интенсивности падающего света."],ans:[0,1,3],why:"Первое — первый закон Ньютона. При плавлении температура постоянна, внутренняя энергия растёт. Для индукционного тока нужно изменение магнитного потока, при неизменном потоке тока нет. При последовательном соединении ток одинаков. Энергия фотоэлектронов зависит от частоты, а не от интенсивности."},
   {type:"multi",q:"Выберите все верные утверждения о физических явлениях, величинах и закономерностях.",opts:["Сила трения скольжения тем больше, чем больше площадь соприкосновения тел.","Давление насыщенного пара при постоянной температуре не зависит от занимаемого им объёма.","Сила Лоренца не совершает работы.","Электромагнитные волны являются продольными.","Энергия фотона прямо пропорциональна частоте света."],ans:[1,2,4],why:"Сила трения скольжения не зависит от площади. Давление насыщенного пара определяется температурой. Сила Лоренца перпендикулярна скорости, работы не совершает. Электромагнитные волны поперечные. E = hν."},
   {type:"multi",q:"Выберите все верные утверждения о физических явлениях, величинах и закономерностях.",opts:["Период колебаний математического маятника при малых углах отклонения не зависит от массы груза.","При изобарном расширении идеального газа его внутренняя энергия не изменяется.","При параллельном соединении резисторов напряжение на каждом из них одинаково.","Магнитное поле действует на покоящуюся заряженную частицу с силой Лоренца.","При β⁻-распаде зарядовое число ядра уменьшается на 1."],ans:[0,2],why:"T = 2π√(l/g), масса не входит. При изобарном расширении температура растёт, значит растёт и внутренняя энергия. Параллельное соединение — напряжение одинаково. Сила Лоренца зависит от скорости, на покоящийся заряд равна нулю. При β⁻-распаде Z растёт на 1."},
   {type:"multi",q:"Выберите все верные утверждения о физических явлениях, величинах и закономерностях.",opts:["Если лифт движется с ускорением, направленным вверх, то вес находящегося в нём человека больше силы тяжести, действующей на него.","Внутренняя энергия идеального одноатомного газа определяется только его температурой и количеством вещества.","ЭДС самоиндукции в катушке тем больше, чем меньше скорость изменения силы тока в ней.","При переходе света из воздуха в стекло частота света уменьшается.","Атом излучает фотон при переходе с более высокого энергетического уровня на более низкий."],ans:[0,1,4],why:"P = m(g + a) > mg. U = (3/2)νRT. ЭДС самоиндукции пропорциональна скорости изменения тока, а не обратно. При переходе в другую среду частота света не меняется, уменьшается скорость и длина волны. Излучение — переход вниз."},
   {type:"multi",q:"Выберите все верные утверждения о физических явлениях, величинах и закономерностях.",opts:["Работа силы тяжести не зависит от формы траектории, а определяется только начальным и конечным положениями тела.","Давление идеального газа при постоянном объёме прямо пропорционально его температуре по шкале Цельсия.","Электрический ток в металлах — это направленное движение положительных ионов.","Линии магнитной индукции магнитного поля тока замкнуты.","Фотоэффект возникает при любой частоте света, если интенсивность излучения достаточно велика."],ans:[0,3],why:"Сила тяжести потенциальна, A = mg(h₁ − h₂). Давление пропорционально абсолютной температуре в кельвинах, а не градусам Цельсия. Ток в металлах создают электроны. Магнитных зарядов нет, линии замкнуты. Для фотоэффекта нужна частота выше красной границы, интенсивность этого не заменит."},
   {type:"multi",q:"Выберите все верные утверждения о физических явлениях, величинах и закономерностях.",opts:["Импульс замкнутой системы тел сохраняется при любых взаимодействиях тел внутри этой системы.","Температура кипения жидкости не зависит от внешнего давления.","Работа электростатического поля при перемещении заряда по замкнутой траектории равна нулю.","В электромагнитной волне векторы напряжённости электрического поля и индукции магнитного поля перпендикулярны друг другу.","Период полураспада радиоактивного вещества уменьшается при нагревании вещества."],ans:[0,2,3],why:"Закон сохранения импульса. Кипение зависит от давления: в горах вода кипит при температуре ниже 100 °C. Электростатическое поле потенциально. В электромагнитной волне E ⊥ B. Период полураспада от температуры не зависит."},
   {type:"multi",q:"Выберите все верные утверждения о физических явлениях, величинах и закономерностях.",opts:["Потенциальная энергия сжатой пружины прямо пропорциональна её деформации.","При изотермическом сжатии идеального газа его давление растёт, а внутренняя энергия не изменяется.","Мощность тока на резисторе постоянного сопротивления прямо пропорциональна силе тока.","Угол отражения света от зеркальной поверхности равен углу падения.","Разрежённые атомарные газы дают линейчатый спектр излучения."],ans:[1,3,4],why:"Eп = kx²/2, зависимость квадратичная. При изотермическом сжатии pV = const, давление растёт, а температура и внутренняя энергия постоянны. P = I²R, зависимость квадратичная. Закон отражения верен. Линейчатый спектр дают атомы разрежённого газа."},
   {type:"multi",q:"Выберите все верные утверждения о физических явлениях, величинах и закономерностях.",opts:["Ускорение свободного падения тела в вакууме вблизи поверхности Земли не зависит от массы тела.","КПД тепловой машины может быть равен 100 %.","Электроёмкость плоского конденсатора обратно пропорциональна расстоянию между его пластинами.","Сила Ампера, действующая на прямой проводник с током в магнитном поле, равна нулю, если проводник расположен перпендикулярно линиям магнитной индукции.","В ядерных реакциях сохраняются суммарное зарядовое число и суммарное массовое число."],ans:[0,2,4],why:"g не зависит от массы. КПД = 1 − Tх/Tн всегда меньше 100 %. C = ε₀εS/d. F = IBl sin α: при перпендикулярном расположении синус равен 1 и сила максимальна. В ядерной реакции сохраняются сумма Z и сумма A."}
  ]}
];

const parse = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (k,n) => { const d = parse(k); d.setDate(d.getDate()+n); return key(d); };
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const plural = (n,one,few,many) => { const m10=n%10, m100=n%100; if (m10===1&&m100!==11) return one; if (m10>=2&&m10<=4&&(m100<10||m100>=20)) return few; return many; };
const fmtDate = k => parse(k).toLocaleDateString("ru-RU",{day:"numeric",month:"long"});

let S = blank();
function blank(){ return {v:1, items:{}, lessons:{}, days:{}, boss:{}, updated:0}; }
function loadLocal(){ try { const raw = localStorage.getItem(LS_KEY); if (raw) { const s = JSON.parse(raw); if (s && s.v === 1) S = s; } } catch(e) {} }
function commit(){ S.updated = Date.now(); try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e) {} }

function prog(id){ return S.items[id] || {b:0, d:null, r:0, w:0, l:null}; }
function grade(id, ok){
  const t = today(), p = Object.assign({}, prog(id));
  if (ok) { if (p.l !== t || p.b === 0) p.b = Math.min(p.b+1, INTERVALS.length-1); p.r++; }
  else { p.b = 1; p.w++; }
  p.l = t; p.d = addDays(t, INTERVALS[p.b]);
  S.items[id] = p;
  if (!S.days[t]) S.days[t] = 1;
}
function dueIds(){ const t = today(); return Object.keys(S.items).filter(id => ITEMS[id] && S.items[id].b >= 1 && S.items[id].d <= t).sort((a,b) => S.items[a].d < S.items[b].d ? -1 : 1); }
function topicMastery(t){ if (!t.id) return 0; return t.itemIds.reduce((s,id) => s + Math.min(prog(id).b,5)/5, 0) / t.itemIds.length; }
function topicStatus(t){
  if (!t.id) return "lock";
  if (!S.lessons[t.id]) return "new";
  const min = Math.min(...t.itemIds.map(id => prog(id).b));
  return min >= 5 ? "fixed" : min >= 2 ? "mastered" : "learning";
}
const STATUS = {lock:"скоро", new:"не начато", learning:"учу", mastered:"освоено", fixed:"закреплено"};
function pointsHeld(){ let s = 0; Object.values(TOPICS).forEach(t => s += topicMastery(t) * POINTS[t.num]); return Math.round(s); }
function streak(){ let k = today(); if (!S.days[k]) k = addDays(k,-1); let n = 0; while (S.days[k]) { n++; k = addDays(k,-1); } return n; }
function weekDays(){ const t = today(); const dow = (parse(t).getDay()+6)%7; let n = 0; for (let i=0;i<=dow;i++) if (S.days[addDays(t,-i)]) n++; return n; }
function nextLesson(){ for (const b of BLOCKS) for (const t of b.topics) if (t.id && !S.lessons[t.id]) return t; return null; }
function bossOpen(bs){ return bs.topics.every(id => S.lessons[id]); }
function nextDueDate(){ const ds = Object.values(S.items).filter(p => p.b>=1).map(p => p.d).sort(); return ds[0] || null; }
function cellsHtml(str){ return `<span class="cells">${String(str).split("").map(ch => `<span class="cell${/[\/%]/.test(ch)?" sep":""}">${esc(ch)}</span>`).join("")}</span>`; }

let sess = null;

function renderHome(){
  const due = dueIds(), nl = nextLesson(), st = streak(), wk = weekDays(), pts = pointsHeld();
  let actions = "";
  if (due.length) actions += `<button class="btn primary" data-act="review"><span><span class="t">Повторение на сегодня · ${due.length}</span><br><span class="sub">≈ ${Math.max(1,Math.ceil(due.length*0.6))} мин. Задания, срок которых пришёл.</span></span><span class="arr">→</span></button>`;
  if (nl) actions += `<button class="btn${due.length?"":" primary"}" data-act="topic" data-id="${nl.id}"><span><span class="t">Задание №${nl.num} · ${esc(nl.title)}</span><br><span class="sub">≈ 10 мин: разбор и тренировка</span></span><span class="arr">→</span></button>`;
  BOSSES.forEach(bs => { if (bossOpen(bs) && !(S.boss[bs.id]||{}).passed) actions += `<button class="btn" data-act="boss" data-id="${bs.id}"><span><span class="t">Босс · ${esc(bs.title)}</span><br><span class="sub">${bs.size} заданий, нужно ${bs.pass} верных</span></span><span class="arr">→</span></button>`; });
  const nd = nextDueDate();
  if (!due.length && !nl) actions += `<p class="note">На сегодня всё. ${nd ? "Следующее повторение — "+fmtDate(nd)+"." : ""} Новые задания скоро появятся.</p>`;
  else if (!due.length && nd) actions += `<p class="note">Повторять сегодня нечего. Следующее повторение — ${fmtDate(nd)}.</p>`;

  const blocks = BLOCKS.map(b => {
    const open = b.topics.some(t => t.id);
    const ready = b.topics.filter(t => t.id).length;
    const nums = b.topics.length > 1 ? `№${b.topics[0].num}–${b.topics[b.topics.length-1].num}` : `№${b.topics[0].num}`;
    const rows = b.topics.map(t => {
      const s = topicStatus(t), m = Math.round(topicMastery(t)*100);
      return `<button class="topic" ${t.id?`data-act="topic" data-id="${t.id}"`:"disabled"}>
        <span class="n">${t.num}</span>
        <span class="tt"><span>${esc(t.title)}</span><span class="ts">${esc(t.fmt)}</span>${t.id && S.lessons[t.id] ? `<span class="bar"><i style="width:${m}%"></i></span>` : ""}</span>
        <span class="chip ${s}">${STATUS[s]}</span></button>`;
    }).join("");
    const boss = BOSSES.filter(bs => bs.block === b.id).map(bs => {
      const r = S.boss[bs.id];
      const range = `№${TOPICS[bs.topics[0]].num}–${TOPICS[bs.topics[bs.topics.length-1]].num}`;
      const txt = r && r.passed ? `Пройден · лучший результат ${r.best}/${bs.size}` : r ? `Лучший результат ${r.best}/${bs.size}, нужно ${bs.pass}` : bossOpen(bs) ? `Открыт. ${bs.size} заданий по ${range}, нужно ${bs.pass} верных.` : `Откроется, когда откроешь все уроки ${range}.`;
      return `<div class="boss"><span class="kicker">Босс · ${esc(bs.title)}</span><span class="note">${txt}</span>${bossOpen(bs)?`<button class="btn small" data-act="boss" data-id="${bs.id}">Сразиться</button>`:""}</div>`;
    }).join("");
    return `<details class="block" ${open?"open":""}><summary><span class="bt">${esc(b.title)}</span><span class="bm">${nums}${open?` · открыто ${ready} из ${b.topics.length}`:" · скоро"}</span></summary><div class="topics">${rows}</div>${boss}</details>`;
  }).join("");

  app.innerHTML = `
  <header class="top">
    <span class="kicker">Тренажёр ЕГЭ · физика</span>
    <h1>Физика 2027</h1>
    <span class="target"><span class="mono">26</span> заданий · <span class="mono">45</span> первичных баллов · <span class="mono">3</span> ч <span class="mono">55</span> мин</span>
  </header>
  <section class="stats" aria-label="Прогресс">
    <div class="stat"><span class="lbl">Серия, дней</span>${cellsHtml(pad(st,2))}</div>
    <div class="stat"><span class="lbl">Неделя, дней</span>${cellsHtml(wk+"/5")}</div>
    <div class="stat"><span class="lbl">Баллов из 45</span>${cellsHtml(pad(pts,2))}</div>
  </section>
  <section class="today"><h2>Сегодня</h2>${actions}</section>
  <section class="map"><h2>Задания ЕГЭ</h2>${blocks}</section>
  <details class="how"><summary>Как это работает</summary><ul>
    <li>Каждое задание ЕГЭ — отдельная тема: что проверяют, формулы, ловушки и тренировка в формате экзамена.</li>
    <li>Ошибся — задание вернётся в конце тренировки и завтра. Верные ответы возвращаются через 1, 3, 7, 14, 30 и 60 дней.</li>
    <li>Открыл урок — тема отмечается как начатая.</li>
    <li>«Освоено» — каждое задание темы решено верно хотя бы дважды в разные дни. «Закреплено» — дошло до интервала в 30 дней.</li>
    <li>«Баллы под контролем» — сколько первичных баллов из 45 приходится на задания, которые ты уже освоил.</li>
    <li>15 минут в день дают больше, чем два часа раз в неделю.</li>
    <li>Считай g = 10 м/с². Дробные ответы пиши через запятую, отрицательные — с минусом (кнопка ±).</li>
  </ul></details>
  <details class="how"><summary>Резервная копия прогресса</summary>
    <div class="backup">
      <p class="note">Скопируй код и сохрани его, например, в «Избранном» Telegram. Если прогресс пропадёт или ты сменишь телефон — вставь код сюда и нажми «Восстановить».</p>
      <div class="row"><button class="btn small" data-act="export">Скопировать код</button></div>
      <textarea id="backupcode" rows="3" placeholder="Вставь код сюда" aria-label="Код прогресса"></textarea>
      <div class="row"><button class="btn small" data-act="import">Восстановить</button></div>
      <p class="note" id="backupmsg" role="status"></p>
    </div>
  </details>
  <footer class="sync">Прогресс хранится в этом браузере. Занимайся с одного устройства и иногда сохраняй резервный код.</footer>`;
}

function exportCode(){
  const code = "FZ1." + btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  const ta = document.getElementById("backupcode"), msg = document.getElementById("backupmsg");
  ta.value = code;
  const done = () => { msg.textContent = "Код скопирован. Сохрани его в заметках или в «Избранном» Telegram."; };
  const fallback = () => { ta.focus(); ta.select(); msg.textContent = "Код выделен в поле выше — скопируй его вручную."; };
  try { navigator.clipboard.writeText(code).then(done, fallback); } catch(e) { fallback(); }
}
function importCode(){
  const ta = document.getElementById("backupcode"), msg = document.getElementById("backupmsg");
  const raw = (ta.value || "").trim();
  try {
    if (!raw.startsWith("FZ1.")) throw 0;
    const s = JSON.parse(decodeURIComponent(escape(atob(raw.slice(4)))));
    if (!s || s.v !== 1 || typeof s.items !== "object") throw 0;
    S = s; commit(); renderHome();
    const m = document.getElementById("backupmsg"); if (m) m.textContent = "Прогресс восстановлен.";
  } catch(e) { msg.textContent = "Код не подошёл. Проверь, что он скопирован целиком и начинается с FZ1."; }
}

function cardRow(c){
  const head = c.type === "formula" ? `<span class="tn">${esc(c.name)}</span><span class="td">${F(c.f)}</span>` : `<span class="tn">${esc(c.term)}</span><span class="td">${esc(c.def)}</span>`;
  return `<details class="term"><summary>${head}<span class="tl">Как это в жизни</span></summary><p class="tx">${esc(c.life||"")}</p></details>`;
}
function renderTopic(id){
  const t = TOPICS[id], b = BLOCKS.find(x => x.id === t.block);
  if (!S.lessons[id]) { S.lessons[id] = today(); commit(); }
  const body = t.lesson.map(x => x.p ? `<p>${x.p}</p>` : x.h ? `<h3>${esc(x.h)}</h3>` : x.ul ? `<ul>${x.ul.map(li => `<li>${li}</li>`).join("")}</ul>` : x.svg ? x.svg : x.life ? `<div class="life"><span class="kicker">В жизни</span>${x.life}</div>` : "").join("");
  app.innerHTML = `
  <button class="back" data-act="home">← Все задания</button>
  <header class="top"><span class="kicker">${esc(b.title)} · задание №${t.num} · ${esc(t.fmt)}</span><h1>${esc(t.title)}</h1></header>
  <article class="lesson">${body}
    <div class="termshead"><h3>Формулы и понятия</h3><button class="back" data-act="expand">Раскрыть все</button></div>
    <p class="note">Нажми на строку — откроется пример из жизни.</p>
    <div class="terms">${t.cards.map(cardRow).join("")}</div>
  </article>
  <button class="btn primary" data-act="quiz" data-id="${t.id}"><span><span class="t">Тренировка · ${t.itemIds.length} заданий</span><br><span class="sub">Формулы, понятия и задания в формате ЕГЭ</span></span><span class="arr">→</span></button>`;
  window.scrollTo(0,0);
}

function distractors(item, field, n){
  const same = shuffle(TOPICS[item.topic].itemIds.map(id => ITEMS[id]).filter(x => x.type === item.type && x.id !== item.id));
  const all = shuffle(Object.values(ITEMS).filter(x => x.type === item.type && x.id !== item.id && x.topic !== item.topic));
  const out = [];
  for (const x of same.concat(all)) { if (out.length >= n) break; if (!out.includes(x[field]) && x[field] !== item[field]) out.push(x[field]); }
  return out;
}
function makeInst(item){
  if (item.type === "formula") {
    const opts = shuffle([item.f, ...distractors(item, "f", 3)]);
    return {item, kind:"single", prompt:"Какая формула подходит?", def:item.name, opts:opts.map(F), ans:opts.indexOf(item.f), why:`${item.name}: ${F(item.f)}`, whyHtml:true, life:item.life};
  }
  if (item.type === "term") {
    const opts = shuffle([item.term, ...distractors(item, "term", 3)]);
    return {item, kind:"single", prompt:"Какое понятие подходит к определению?", def:item.def, opts:opts.map(esc), ans:opts.indexOf(item.term), why:`${esc(item.term)} — ${esc(item.def)}`, whyHtml:true, life:item.life};
  }
  if (item.type === "num") return {item, kind:"num", prompt:item.q, svg:item.svg, unit:item.unit, ans:item.ans, why:item.why};
  if (item.type === "multi") return {item, kind:"multi", prompt:item.q, svg:item.svg, opts:item.opts.map(esc), ans:item.ans.slice().sort((a,b)=>a-b), why:item.why};
  return {item, kind:"rows", sub:item.kind, prompt:item.q, rows:item.rows, choices:item.kind === "change" ? CHANGE : item.choices.map(F), ans:item.ans, why:item.why};
}

function startSession(mode, ids, meta){
  sess = {mode, meta:meta||{}, queue:ids.map(id => makeInst(ITEMS[id])), i:0, total:ids.length, correct:0, retried:new Set(), picked:new Set(), rowPick:[], typed:"", checked:false, lastOk:false};
  renderQuestion(); window.scrollTo(0,0);
}

function answerDigits(q){
  if (q.kind === "multi") return q.ans.map(i => i+1).join("");
  if (q.kind === "rows") return q.ans.join("");
  return "";
}
function renderQuestion(){
  const q = sess.queue[sess.i], n = sess.i + 1, all = sess.queue.length;
  const title = sess.mode === "lesson" ? "Задание №"+TOPICS[sess.meta.topic].num+" · тренировка" : sess.mode === "boss" ? "Босс · "+sess.meta.title : "Повторение";
  const isRetry = sess.i >= sess.total;
  const num = TOPICS[q.item.topic].num;
  let body = "", foot = "";
  if (q.kind === "single" || q.kind === "multi") {
    body = `<div class="opts">${q.opts.map((o,i) => {
      let cls = "";
      if (sess.checked) { const right = q.kind === "single" ? i === q.ans : q.ans.includes(i); if (right) cls = "right"; else if (sess.picked.has(i)) cls = "wrong"; }
      else if (sess.picked.has(i)) cls = "sel";
      return `<button class="opt ${cls}" data-act="pick" data-i="${i}" ${sess.checked?"disabled":""}><span class="num">${i+1}</span><span>${o}</span></button>`;
    }).join("")}</div>`;
    if (q.kind === "multi" && !sess.checked) {
      const picked = [...sess.picked].sort((a,b)=>a-b).map(i => i+1).join("");
      foot = `<div class="answerline">Ответ: ${picked ? cellsHtml(picked) : `<span class="cells"><span class="cell empty">·</span></span>`}</div><button class="btn primary" data-act="check" ${picked?"":"disabled"}><span class="t">Проверить</span><span class="arr kbd">Enter</span></button>`;
    }
  } else if (q.kind === "num") {
    const cls = sess.checked ? (sess.lastOk ? "right" : "wrong") : "";
    body = `<div class="numrow"><span>Ответ:</span><button class="pm" data-act="neg" ${sess.checked?"disabled":""} aria-label="Сменить знак">±</button><input id="numans" inputmode="decimal" autocomplete="off" aria-label="Ответ" class="${cls}" value="${esc(sess.typed)}" ${sess.checked?"disabled":""}><span class="unit">${esc(q.unit)}</span></div>`;
    if (!sess.checked) foot = `<button class="btn primary" data-act="check"><span class="t">Проверить</span><span class="arr kbd">Enter</span></button>`;
  } else {
    const legend = q.sub === "change"
      ? `<div class="legend">${CHANGE.map((c,j) => `<span class="ln"><span class="d">${j+1}</span><span>${c}</span></span>`).join("")}</div>`
      : `<div class="legend">${q.choices.map((c,j) => `<span class="ln"><span class="d">${j+1})</span><span>${c}</span></span>`).join("")}</div>`;
    const rows = q.rows.map((r,ri) => `<div class="rowq"><span class="rl">${"АБ"[ri]}) ${esc(r)}</span><div class="rc">${q.choices.map((_,j) => {
      const d = j+1; let cls = "";
      if (sess.checked) { if (q.ans[ri] === d) cls = "right"; else if (sess.rowPick[ri] === d) cls = "wrong"; }
      else if (sess.rowPick[ri] === d) cls = "sel";
      return `<button class="rb ${cls}" data-act="row" data-r="${ri}" data-d="${d}" ${sess.checked?"disabled":""}>${d}</button>`;
    }).join("")}</div></div>`).join("");
    body = `${legend}<div class="rows">${rows}</div>`;
    if (!sess.checked) {
      const full = q.rows.every((_,ri) => sess.rowPick[ri]);
      const digits = q.rows.map((_,ri) => sess.rowPick[ri] || "·").join("");
      foot = `<div class="answerline">Ответ (А, Б): ${cellsHtml(digits)}</div><button class="btn primary" data-act="check" ${full?"":"disabled"}><span class="t">Проверить</span><span class="arr kbd">Enter</span></button>`;
    }
  }
  if (sess.checked) {
    let right = "";
    if (q.kind === "multi" || q.kind === "rows") right = `<div class="answerline">Правильный ответ: ${cellsHtml(answerDigits(q))}</div>`;
    if (q.kind === "num") right = `<div class="answerline">Правильный ответ: <b class="mono">${fmtNum(q.ans)} ${esc(q.unit)}</b></div>`;
    foot = `<div class="fb ${sess.lastOk?"ok":"bad"}"><span class="h">${sess.lastOk?"Верно":"Ошибка"}</span>${right}<p>${q.whyHtml ? q.why : esc(q.why||"")}</p>${q.life?`<div class="life"><span class="kicker">В жизни</span>${esc(q.life)}</div>`:""}${!sess.lastOk && sess.mode!=="boss" && !isRetry ? `<p class="note">Задание вернётся в конце и завтра.</p>`:""}</div>
      <button class="btn primary" data-act="next"><span class="t">${sess.i+1 < all ? "Дальше" : "Завершить"}</span><span class="arr kbd">Enter</span></button>`;
  }
  app.innerHTML = `
  <div class="qhead"><span class="kicker">${esc(title)}</span><button class="back" data-act="quit">Выйти</button></div>
  <div class="progress"><i style="width:${Math.round(sess.i/all*100)}%"></i></div>
  <section class="qcard">
    <span class="note mono">${n} / ${all} · №${num}${isRetry?" · повтор ошибки":""}</span>
    <div class="qtext">${q.prompt}</div>
    ${q.def ? `<p class="qdef">${esc(q.def)}</p>` : ""}
    ${q.svg || ""}
    ${q.kind === "multi" ? `<p class="note">Выберите все верные утверждения.</p>` : ""}
    ${q.sub === "change" ? `<p class="note">Для каждой величины выберите характер изменения. Цифры могут повторяться.</p>` : ""}
    ${q.sub === "match" ? `<p class="note">К каждой позиции первого столбца подберите номер из списка.</p>` : ""}
    ${body}
    ${foot}
  </section>`;
  if (q.kind === "num" && !sess.checked) { const inp = document.getElementById("numans"); if (inp) inp.focus({preventScroll:true}); }
}

function parseNum(s){ s = String(s).trim().replace(/\s/g,"").replace(",",".").replace(/[−–]/g,"-"); if (!/^-?\d+(\.\d+)?$/.test(s)) return NaN; return Number(s); }
function check(){
  const q = sess.queue[sess.i];
  let ok = false;
  if (q.kind === "single") ok = sess.picked.has(q.ans) && sess.picked.size === 1;
  else if (q.kind === "multi") ok = q.ans.length === sess.picked.size && q.ans.every(i => sess.picked.has(i));
  else if (q.kind === "num") { const inp = document.getElementById("numans"); sess.typed = inp ? inp.value : ""; const v = parseNum(sess.typed); if (isNaN(v)) { if (inp) { inp.focus(); inp.placeholder = "число"; } return; } ok = Math.abs(v - q.ans) < 1e-9 * Math.max(1, Math.abs(q.ans)); }
  else ok = q.ans.every((d,ri) => sess.rowPick[ri] === d);
  sess.checked = true; sess.lastOk = ok;
  if (sess.i < sess.total) {
    if (ok) sess.correct++;
    grade(q.item.id, ok); commit();
    if (!ok && sess.mode !== "boss" && !sess.retried.has(q.item.id)) { sess.retried.add(q.item.id); sess.queue.push(makeInst(q.item)); }
  }
  renderQuestion();
}
function next(){
  sess.i++; sess.picked = new Set(); sess.rowPick = []; sess.typed = ""; sess.checked = false;
  if (sess.i >= sess.queue.length) return finish();
  renderQuestion(); window.scrollTo(0,0);
}
function finish(){
  const s = sess; sess = null;
  let extra = "";
  if (s.mode === "boss") {
    const bs = BOSSES.find(b => b.id === s.meta.id);
    const prev = S.boss[bs.id] || {best:0, passed:false};
    const passed = s.correct >= bs.pass;
    S.boss[bs.id] = {best:Math.max(prev.best, s.correct), passed:prev.passed || passed, date:today()};
    commit();
    extra = passed ? `<p><b>Босс повержен.</b> «${esc(bs.title)}» пройдена.</p>` : `<p>Нужно ${bs.pass} верных. Повтори задания, где ошибся, и возвращайся.</p>`;
  }
  const wrong = s.total - s.correct, nd = nextDueDate(), st = streak();
  app.innerHTML = `
  <section class="result">
    <span class="kicker">${s.mode==="lesson"?"Тренировка завершена":s.mode==="boss"?"Босс":"Повторение завершено"}</span>
    <div class="big mono">${s.correct}/${s.total}</div>
    ${extra}
    <p>${wrong ? `Ошибок: ${wrong}. Эти задания вернутся завтра.` : "Без ошибок."} ${nd ? "Следующее повторение — "+fmtDate(nd)+"." : ""}</p>
    <p class="note">Серия: ${st} ${plural(st,"день","дня","дней")} подряд. Баллы под контролем: ${pointsHeld()} из 45.</p>
    <div class="row"><button class="btn small" data-act="home">К заданиям</button></div>
  </section>`;
  window.scrollTo(0,0);
}

app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === "home" || act === "quit") { sess = null; renderHome(); window.scrollTo(0,0); }
  else if (act === "topic") renderTopic(id);
  else if (act === "expand") { const ds = [...document.querySelectorAll("details.term")]; const open = !ds.every(d => d.open); ds.forEach(d => d.open = open); el.textContent = open ? "Свернуть все" : "Раскрыть все"; }
  else if (act === "quiz") { S.lessons[id] = S.lessons[id] || today(); commit(); startSession("lesson", shuffle(TOPICS[id].itemIds), {topic:id}); }
  else if (act === "review") startSession("review", dueIds().slice(0,30));
  else if (act === "export") exportCode();
  else if (act === "import") importCode();
  else if (act === "boss") { const bs = BOSSES.find(b => b.id === id); const pool = bs.topics.flatMap(t => TOPICS[t].itemIds.filter(x => ITEMS[x].type !== "formula" && ITEMS[x].type !== "term")); startSession("boss", shuffle(pool).slice(0, bs.size), {id:bs.id, title:bs.title}); }
  else if (!sess || sess.checked) { if (act === "next" && sess) next(); }
  else if (act === "pick") {
    const i = +el.dataset.i, q = sess.queue[sess.i];
    if (q.kind === "single") { sess.picked = new Set([i]); check(); }
    else { sess.picked.has(i) ? sess.picked.delete(i) : sess.picked.add(i); renderQuestion(); }
  }
  else if (act === "row") { sess.rowPick[+el.dataset.r] = +el.dataset.d; renderQuestion(); }
  else if (act === "neg") { const inp = document.getElementById("numans"); if (inp) { inp.value = inp.value.startsWith("-") ? inp.value.slice(1) : "-" + inp.value; inp.focus(); } }
  else if (act === "check") check();
});

document.addEventListener("keydown", e => {
  if (!sess || e.metaKey || e.ctrlKey || e.altKey) return;
  const q = sess.queue[sess.i];
  if (e.key === "Enter") {
    e.preventDefault();
    if (sess.checked) return next();
    if (q.kind === "num") return check();
    if (q.kind === "multi" && sess.picked.size) return check();
    if (q.kind === "rows" && q.rows.every((_,ri) => sess.rowPick[ri])) return check();
    return;
  }
  if (e.target && e.target.tagName === "INPUT") return;
  if (/^[1-9]$/.test(e.key) && !sess.checked && (q.kind === "single" || q.kind === "multi")) {
    const i = +e.key - 1; if (i >= q.opts.length) return;
    if (q.kind === "single") { sess.picked = new Set([i]); check(); }
    else { sess.picked.has(i) ? sess.picked.delete(i) : sess.picked.add(i); renderQuestion(); }
  }
});

loadLocal();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {}
renderHome();
</script>
</body></html>
